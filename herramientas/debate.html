<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12306E">
<title>Herramienta para debates · El Mundo de Felipe</title>
<style>
:root{
  /* Paleta: blanco · azul · dorado */
  --navy:#12306E; --blue:#1F4FB3; --blue-l:#E8EFFC; --cer:#0B6BA3;
  --gold:#C9961F; --gold-b:#E0B84A; --gold-l:#FBF3DD; --gold-d:#8A6410;
  --danger:#B3261E; --danger-l:#FBE9E7;
  --ink:#16223F; --muted:#4F5D75; --line:#DCE3F0; --bg:#F5F8FD; --white:#FFFFFF;
  --team:var(--blue); --team-l:var(--blue-l);
  --r:14px; --shadow:0 2px 12px rgba(18,48,110,.08);
  --top:58px; --tabs:66px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:"Segoe UI",Calibri,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:Cambria,Georgia,"Times New Roman",serif;color:var(--navy);line-height:1.15}
h1{font-size:clamp(1.9rem,6vw,2.8rem)}
h2{font-size:1.42rem;margin-bottom:.4em}
h3{font-size:1.06rem;margin-bottom:.3em}
p{margin-bottom:.55em}
a{color:var(--blue)}
.small{font-size:.86rem;color:var(--muted)}
.wrap{max-width:780px;margin:0 auto;padding:18px 16px 96px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* barra superior */
.top{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--team);color:#fff}
.top .id{flex:1;min-width:0}
.top .t1{font-weight:800;font-size:.98rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .prog{background:var(--gold);color:var(--navy);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:800;white-space:nowrap;min-height:38px;display:inline-flex;align-items:center;gap:4px;border:none}
.top .t2{font-size:.76rem;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.top button,.top a.tb{background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:10px;padding:9px 12px;font-size:.82rem;font-weight:700;text-decoration:none;min-height:40px;display:inline-flex;align-items:center}
.cloud{display:inline-block;font-size:.7rem;font-weight:800;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.2);margin-left:6px}

/* pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tabs) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:#fff;border-top:1px solid var(--line)}
.tabs[hidden]{display:none}
.tabs button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;font-weight:700;color:var(--muted);min-width:0}
.tabs button .ic{font-size:1.25rem;line-height:1}
.tabs button{position:relative}
.tabs button.on{color:var(--navy)}
.tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.tabs button.on .ic{transform:scale(1.12)}
.has-tabs .wrap{padding-bottom:calc(var(--tabs) + 90px)}

/* tarjetas */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.card.tint{background:var(--team-l);border-color:transparent}
.card.sand{background:var(--gold-l);border-color:transparent}
.card.dark{background:var(--navy);color:#fff;border-color:transparent}
.card.dark h2,.card.dark h3{color:var(--gold-b)}
.card.warn{background:var(--gold-l);border:1.5px solid var(--gold)}
.tag{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--team);color:#fff;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
ol.steps{list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:6px 0 6px 38px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:5px;width:26px;height:26px;border-radius:50%;background:var(--team);color:#fff;font-weight:800;font-size:.85rem;display:grid;place-items:center}
ul.dots{list-style:none}
ul.dots li{position:relative;padding:4px 0 4px 18px}
ul.dots li::before{content:"";position:absolute;left:3px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--gold-d)}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:11px;padding:11px 16px;font-weight:800;font-size:.95rem;background:var(--team);color:#fff;min-height:44px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--team);border:1.5px solid var(--team)}
.btn.sm{padding:8px 12px;font-size:.84rem;border-radius:9px;min-height:38px}
.btn.full{width:100%}
.btn.danger{background:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lnk{border:none;background:none;color:var(--danger);font-weight:800;font-size:.82rem;padding:8px 6px;min-height:36px}

/* campos */
label.lb{display:block;font-size:.78rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--navy);margin:12px 0 4px}
textarea,input[type=text],input[type=url],select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;background:#fff;resize:vertical}
textarea{min-height:70px}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--team);box-shadow:0 0 0 3px var(--team-l)}
.hint{font-size:.8rem;color:var(--muted);margin-top:3px}

/* portada del debate */
.hero{background:#fff;color:var(--ink);padding:26px 18px 64px;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero h1{color:var(--navy);margin:.15em 0 .3em}
.hero p.lead{color:var(--muted);font-size:1.02rem}
.hero .k{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-d)}
.hero .mo{background:var(--gold-l);border:1.5px solid var(--gold);color:var(--navy);border-radius:12px;padding:12px 14px;font-family:Cambria,Georgia,serif;font-weight:700;font-style:italic;font-size:1.08rem;margin-top:14px}
.hero svg{position:absolute;left:0;right:0;bottom:-2px;width:100%;height:70px}
.hero .in{max-width:780px;margin:0 auto;position:relative;z-index:1}
.hero a.back{color:var(--blue);font-size:.86rem;font-weight:800;text-decoration:none;display:inline-flex;min-height:36px;align-items:center}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:420px){.teams{grid-template-columns:1fr}}
.tbtn{border:2px solid transparent;border-radius:16px;padding:16px 14px;text-align:left;color:#fff;display:flex;flex-direction:column;gap:4px;min-height:124px;box-shadow:var(--shadow)}
.tbtn .ic{font-size:1.7rem}
.tbtn b{font-size:1.08rem}
.tbtn span{font-size:.85rem;opacity:.95}
.tbtn:disabled{opacity:.4;cursor:default}
.acc{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.acc .av{width:42px;height:42px;border-radius:50%;background:var(--team);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.1rem;flex:0 0 auto}
.acc .tx{flex:1;min-width:180px}

/* lista de verificación */
.chk{list-style:none;margin:4px 0 0}
.chk li{margin:0}
.chk button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:none;border-top:1px solid var(--line);padding:10px 2px;text-align:left;min-height:46px}
.chk li:first-child button{border-top:none}
.chk .bx{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:0 0 auto;font-size:.8rem;font-weight:800;color:#fff}
.chk .ok .bx{background:var(--blue);border-color:var(--blue)}
.chk .half .bx{background:var(--gold-l);border-color:var(--gold);color:var(--gold-d)}
.chk .tx{flex:1}
.chk .go{color:var(--muted);font-size:.8rem;font-weight:700}
.pbar{height:8px;border-radius:99px;background:var(--blue-l);overflow:hidden;margin:8px 0 2px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .4s}
/* evidencia */
.ev{border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:10px;background:#fff}
.ev h3{font-family:inherit;font-size:1rem;color:var(--navy)}
.ev .src{font-size:.76rem;font-style:italic;color:var(--muted);margin-top:4px}
.ev.used{border-color:var(--team);background:var(--team-l)}

/* argumentos */
.arg{border-radius:var(--r);border:1.5px solid var(--line);background:#fff;padding:14px 15px;margin-bottom:14px}
.arg.best{border-color:var(--team);box-shadow:0 0 0 3px var(--team-l)}
.arg .hd{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.arg .n{width:30px;height:30px;border-radius:50%;background:var(--team);color:#fff;display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;width:0;background:var(--team);transition:width .3s}

/* reloj */
.clock{background:var(--navy);color:#fff;border-radius:var(--r);padding:14px 16px;margin-bottom:14px;position:sticky;top:calc(var(--top) + 6px);z-index:20}
.clock .now{font-size:.78rem;color:var(--gold-b);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.clock .ttl{font-size:1.06rem;font-weight:800;margin:2px 0 6px}
.clock .big{font-size:2.8rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.clock .big{color:#fff}
.clock.warn .big{color:var(--gold-b)}
.clock.end .big{color:#ffb4a8}
.clock .btn{background:var(--gold-b);color:var(--navy)}
@media (max-width:700px) and (max-height:820px){.clock{position:static}}
.clock .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.clock .sub{font-size:.8rem;color:#D6E0F5;margin-top:6px}
.turns{list-style:none}
.turns li{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;margin-bottom:6px;cursor:pointer;min-height:48px}
.turns li .tn{min-width:28px;height:28px;border-radius:50%;background:var(--gold-l);color:var(--navy);font-weight:800;display:grid;place-items:center;font-size:.85rem;flex:0 0 auto;padding:0 6px}
.turns li .tx{flex:1;font-size:.92rem}
.turns li .tx small{display:block;color:var(--muted);font-size:.76rem}
.turns li .tm{font-weight:800;color:var(--navy)}
.turns li.cur{border-color:var(--team);background:var(--team-l)}
.turns li.cur .tn{background:var(--team);color:#fff}
.turns li.done{opacity:.55}
.turns.static li{cursor:default}
.miturno{border:2px solid var(--team);background:#fff}
.miturno .who{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--team)}
.miturno ul{margin:6px 0 0 18px}
.miturno li{margin:4px 0}

/* notas */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:.84rem;font-weight:700;color:var(--muted);min-height:38px}
.chip.on{background:var(--team);border-color:var(--team);color:#fff}
.note{border-left:4px solid var(--team);background:#fff;border-radius:0 10px 10px 0;padding:8px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.note .meta{font-size:.74rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.note .meta .lnk{margin-left:auto}
.note p{margin:2px 0 0;white-space:pre-wrap}
.note.t-debil,.note.t-falta{border-left-color:var(--gold-d)}
.note.t-idea,.note.t-mejor{border-left-color:var(--cer)}
.note.t-pregunta,.note.t-duda{border-left-color:var(--gold-d)}

/* pauta */
.crit{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.crit h3{font-family:inherit;font-size:1rem}
.crit .lv{font-size:.78rem;color:var(--muted);margin-bottom:6px}
.score{display:flex;align-items:center;gap:8px;margin-top:6px}
.score .who{width:84px;font-weight:800;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score button{width:48px;height:42px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-weight:800}
.score button.on{background:var(--team);border-color:var(--team);color:#fff}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tot .box{border-radius:12px;padding:14px;text-align:center;color:#fff}
.tot .box b{display:block;font-size:2.2rem;line-height:1.1}
.counter{display:flex;align-items:center;gap:10px}
.counter button{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:1.1rem}
.counter b{min-width:2ch;text-align:center;font-size:1.3rem}

/* verificación */
.vf{border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;margin-bottom:8px}
.vf .top2{display:flex;gap:8px;align-items:center;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.vf .top2 .lnk{margin-left:auto}
.badge{display:inline-block;border-radius:6px;padding:1px 7px;font-size:.72rem;font-weight:800;color:#fff}
.b-ok{background:var(--blue)} .b-dud{background:var(--gold-d)} .b-fal{background:var(--danger)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:84px;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:10px 8px;font-weight:800;font-size:.88rem;min-height:44px}
.seg button.on{background:var(--team);border-color:var(--team);color:#fff}

/* chip de autoguardado (firebase/autoguardado.js): el estado ya se ve en la barra superior;
   el chip flotante solo aparece si hay un error al guardar. */
.ag-chip:not(.err){display:none!important}
.ag-chip{top:auto!important;right:auto!important;left:12px!important;bottom:calc(14px + env(safe-area-inset-bottom))!important;max-width:calc(100vw - 24px)!important}
.ag-chip button,.ag-chip a{padding:6px 4px!important}
.has-tabs .ag-chip{bottom:calc(var(--tabs) + 10px + env(safe-area-inset-bottom))!important}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--tabs) + 70px);transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:.9rem;font-weight:700;opacity:0;pointer-events:none;transition:all .3s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}

/* editor / herramienta */
.lib{display:grid;gap:12px}
.libitem{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:14px;text-decoration:none;color:inherit}
.libitem .ic{font-size:1.8rem}
.libitem b{display:block;color:var(--navy)}
.libitem span{font-size:.86rem;color:var(--muted)}
.fourteams{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:560px){.fourteams{grid-template-columns:1fr 1fr}}
.fourteams div{border-radius:12px;padding:10px;color:#fff;font-size:.82rem}
.fourteams b{display:block;font-size:.95rem}
.out{word-break:break-all;font-size:.8rem;color:var(--ink);background:var(--gold-l);border-radius:10px;padding:10px;max-height:120px;overflow:auto}

/* impresión */
#print{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  #app,.tabs,#toast,.ag-chip{display:none!important}
  #print{display:block;font-family:Calibri,Arial,sans-serif;color:#000;font-size:11pt}
  #print h1{font-size:18pt;color:#000}
  #print pre{white-space:pre-wrap;font-family:inherit}
}
</style>
<script src="../firebase/df.js?v=20261116" data-sin-aviso></script>

<body>
<div id="app"></div>
<nav class="tabs" id="tabs" hidden aria-label="Secciones del equipo"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print"></div>

<script>
/* =====================================================================
   HERRAMIENTA PARA DEBATES · El Mundo de Felipe
   Un debate = una configuración. Las de la biblioteca están abajo
   (DEBATES). Cualquier docente puede crear otra con el editor:
   se comparte como enlace (la configuración va dentro del enlace).
   ===================================================================== */

/* ---------- valores comunes a todos los debates ---------- */
const ROLES = {
  debate: [
    ['Capitán/a', 'Coordina la preparación y presenta la apertura (3 min).'],
    ['Orador/a de cierre', 'Resume la postura y responde lo que quedó abierto (2 min).'],
    ['Refutador/a', 'Escucha al rival, anota sus puntos débiles y responde (2 min).'],
    ['Investigador/a', 'Busca datos en la ficha de evidencia y se los pasa a los oradores.'],
    ['Estratega de preguntas', 'Prepara y hace las preguntas cruzadas al otro equipo.'],
    ['Cronometrista y secretario/a', 'Controla los tiempos del equipo y anota los argumentos del rival.']
  ],
  jurado: [
    ['Presidente/a', 'Dirige el debate: da la palabra, controla el reloj y hace respetar los turnos.'],
    ['Evaluador/a de argumentos', 'Evalúa si los argumentos tienen afirmación, evidencia y razonamiento.'],
    ['Evaluador/a de evidencia', 'Evalúa si los datos son concretos y tienen fuente.'],
    ['Evaluador/a de refutación', 'Evalúa si cada equipo responde lo que dijo el rival.'],
    ['Evaluador/a de respeto y tiempos', 'Evalúa el respeto a los turnos y a las personas.'],
    ['Relator/a', 'Suma los puntajes y registra los descuentos de la prensa.'],
    ['Vocero/a', 'Lee el veredicto y explica por qué ganó un equipo.']
  ],
  prensa: [
    ['Verificador/a', 'Comprueba cada dato dicho contra las fichas de evidencia.'],
    ['Editor/a', 'Decide qué datos fueron correctos, dudosos o falsos.'],
    ['Reportero/a', 'Informa al jurado los datos falsos en el turno de la prensa.'],
    ['Redactor/a', 'Escribe el titular de prensa del debate.']
  ]
};
const CRITERIOS = [
  ['Argumentos', 'Claros, con afirmación, evidencia y razonamiento', 'Claros, pero sin razonamiento', 'Opiniones sin estructura'],
  ['Evidencia', 'Datos concretos con su fuente', 'Datos sin fuente', 'Sin datos'],
  ['Refutación', 'Responde directamente lo que dijo el rival', 'Responde a medias', 'Ignora al rival'],
  ['Respeto y tiempos', 'Respeta turnos y tiempos en todo momento', 'Una falta', 'Varias faltas']
];
const JURADO = { nombre: 'Comité / Jurado', postura: 'Jurado', icono: '⚖️', color: '#12306E', claro: '#E6EAF4', tipo: 'jurado', mision: 'Dirigir el debate, evaluar a ambos equipos con la pauta y dar el veredicto.' };
const PRENSA = { nombre: 'Prensa verificadora', postura: 'Fact-checkers', icono: '📰', color: '#0B6BA3', claro: '#E3F1FA', tipo: 'prensa', mision: 'Comprobar si los datos que se dicen son ciertos e informar al jurado. Al final, escribir el titular.' };
/* tipo de turno: apertura · pausa · refutacion · preguntas · prensa · cierre ; lado: A, B o '' */
function turnosPara(A, B){
  return [
    ['Apertura · ' + A, 'Capitán/a', 3, 'apertura', 'A'],
    ['Apertura · ' + B, 'Capitán/a', 3, 'apertura', 'B'],
    ['Pausa para preparar refutación', 'Ambos equipos', 2, 'pausa', ''],
    ['Refutación · ' + B, 'Refutadores/as', 2, 'refutacion', 'B'],
    ['Refutación · ' + A, 'Refutadores/as', 2, 'refutacion', 'A'],
    ['Preguntas cruzadas (2 por equipo)', 'Estrategas de preguntas', 4, 'preguntas', ''],
    ['Informe de la prensa', 'Reportero/a', 3, 'prensa', ''],
    ['Pausa estratégica', 'Ambos equipos', 2, 'pausa', ''],
    ['Cierre · ' + B, 'Orador/a de cierre', 2, 'cierre', 'B'],
    ['Cierre · ' + A, 'Orador/a de cierre', 2, 'cierre', 'A']
  ];
}

/* ---------- biblioteca de debates ---------- */
const DEBATES = {
  'dunas-concon': {
    id: 'dunas-concon-2026',          // no cambiar: es la clave con que se guardó el trabajo de los estudiantes
    clave: 'debate-dunas-concon',     // nombre del trabajo en la cuenta (Panel del profe → Trabajos)
    titulo: 'Las Dunas de Concón',
    subtitulo: 'Debate · Biología 1° Medio · Unidad 4',
    gancho: '¿Quién se queda con la duna? Un ecosistema de millones de años frente a nuevos edificios aprobados en 2026.',
    mocion: 'Se debe prohibir toda nueva construcción en el campo dunar de Concón, incluso en terrenos privados.',
    volver: { href: '../index.html', texto: 'El Mundo de Felipe' },

/* ---------- debates creados con el editor (viajan en el enlace) ---------- */
const PALETA = [['#1F4FB3','#E8EFFC'],['#8A6410','#FBF3DD']];
function b64e(str){ const by = new TextEncoder().encode(str); let bin = ''; for(let i = 0; i < by.length; i += 0x8000) bin += String.fromCharCode.apply(null, by.subarray(i, i + 0x8000)); return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length % 4) s += '='; const bin = atob(s); const by = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) by[i] = bin.charCodeAt(i); return new TextDecoder().decode(by); }
function hash(str){ let h = 5381; for(let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; return h.toString(16).padStart(8,'0'); }
const cut = (v, n) => String(v == null ? '' : v).slice(0, n);
function lineas(txt, partes){ return String(txt||'').split('\n').map(l=>l.trim()).filter(Boolean).slice(0, 12).map(l=>{ const p = l.split('|').map(x=>x.trim()); while(p.length < partes) p.push(''); return p.slice(0, partes).map(x=>cut(x, 400)); }); }
/* compacto → configuración completa */
function desdeCompacto(c){
  if(!c || typeof c !== 'object' || !c.m || !c.a || !c.b) throw new Error('El enlace no trae un debate válido.');
  const lado = (x, i, fallback) => {
    const pal = PALETA[(+x.c || i) % PALETA.length];
    return { nombre: cut(x.n, 40) || fallback, postura: cut(x.p, 60) || (i ? 'En contra de la moción' : 'A favor de la moción'), icono: cut(x.i, 4) || (i ? '🔴' : '🟢'),
      color: pal[0], claro: pal[1], tipo: 'debate', mision: cut(x.mi, 200) || (i ? 'Defender que la moción no se apruebe.' : 'Defender que la moción se apruebe.'),
      evidencia: (Array.isArray(x.ev) ? x.ev : []).slice(0, 12).map(e => [cut(e[0], 80), cut(e[1], 400), cut(e[2], 160)]).filter(e => e[0] || e[1]) };
  };
  const json = JSON.stringify(c), h = hash(json);
  return {
    id: 'c-' + h, clave: 'debate-c-' + h, propio: true,
    titulo: cut(c.t, 80) || 'Debate', subtitulo: cut(c.s, 80) || 'Debate', gancho: cut(c.g, 300),
    mocion: cut(c.m, 300), volver: { href: 'debate.html', texto: 'Herramienta para debates' },
    contexto: { datos: (Array.isArray(c.c) ? c.c : []).slice(0, 12).map(d => [cut(d[0], 80), cut(d[1], 400)]), cronologia: [], fuentes: cut(c.f, 300) },
    equipos: { a: lado(c.a, 0, 'Equipo A'), b: lado(c.b, 1, 'Equipo B'), jurado: JURADO, prensa: PRENSA },
    reflexion: cut(c.r, 200) || '¿Qué medida podría acercar las dos posturas?'
  };
}
function completar(cfg){
  const lados = Object.keys(cfg.equipos).filter(k => cfg.equipos[k].tipo === 'debate');
  cfg.lados = lados;
  cfg.turnos = cfg.turnos || turnosPara(cfg.equipos[lados[0]].nombre, cfg.equipos[lados[1]].nombre);
  cfg.criterios = cfg.criterios || CRITERIOS;
  return cfg;
}

/* ---------- LISTA DE VERIFICACIÓN (avance del estudiante) ---------- */
function checklist(){
  const t = team(), d = D(), g = p => (getP(p)||'').toString().trim(), it = [];
  const add = (txt, n, de, tab) => it.push({ txt, n: Math.min(n, de), de, tab });
  add('Elegir mi rol', S.rol?1:0, 1, 'guia');
  add('Votar con mi opinión inicial', g('voto_inicial')?1:0, 1, 'guia');
  if(t.tipo === 'debate'){
    add('Marcar evidencia que usaremos', Object.values(d.usados||{}).filter(Boolean).length?1:0, 1, 'evidencia');
    add('Completar 3 argumentos AER', [0,1,2].filter(i=>argLleno(i)===3).length, 3, 'argumentos');
    add('Marcar el argumento más sólido', g('mejor')?1:0, 1, 'argumentos');
    add('Preparar respuestas al rival', [0,1].filter(i=>g('rival.'+i+'.arg')&&g('rival.'+i+'.resp')).length, 2, 'argumentos');
    add('Escribir 2 preguntas cruzadas', [0,1].filter(i=>g('preg.'+i)).length, 2, 'argumentos');
    add('Anotar observaciones en el debate', (d.notas||[]).length, 3, 'debate');
  }
  if(t.tipo === 'jurado'){
    add('Puntuar la pauta completa', CONFIG.lados.reduce((a,l)=>a+puntos(l).n,0), CONFIG.lados.length*CONFIG.criterios.length, 'pauta');
    add('Anotar observaciones en el debate', (d.notas||[]).length, 3, 'debate');
    add('Elegir al ganador', g('ganador')?1:0, 1, 'veredicto');
    add('Escribir la justificación', g('justif')?1:0, 1, 'veredicto');
  }
  if(t.tipo === 'prensa'){
    add('Registrar datos verificados', (d.verif||[]).length, 4, 'verificar');
    add('Escribir el titular final', g('tit.f')?1:0, 1, 'titular');
    add('Escribir la bajada', g('tit.b')?1:0, 1, 'titular');
  }
  add('Votar al final', g('voto_final')?1:0, 1, 'cierre');
  add('Responder la reflexión', [g('refl.duda'),g('refl.falta'),g('refl.medida')].filter(Boolean).length, 3, 'cierre');
  const hechos = it.filter(x=>x.n>=x.de).length;
  return { it, hechos, total: it.length, pct: Math.round(it.reduce((a,x)=>a+x.n/x.de,0)/it.length*100) };
}
function checklistHTML(){
  const c = checklist();
  return `<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Lista de verificación</h3><b style="color:var(--gold-d)">${c.pct}%</b></div>

/* ---------- DEBATE: reloj, «ahora» y observaciones ---------- */
const clock = { i: 0, left: null, run: false, iv: null, last: 0 };
clock.i = Math.min(+(S.turno||0) || 0, (CONFIG ? CONFIG.turnos.length : 1) - 1);
const fmt = s => { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
function clockHTML(){
  const x = CONFIG.turnos[clock.i], left = clock.left===null ? x[2]*60 : clock.left;
  const cls = left<=0 ? 'end' : left<=30 ? 'warn' : '';
  return `<div class="clock ${cls}" id="clock"><div class="now">Turno ${clock.i+1} de ${CONFIG.turnos.length}</div><div class="ttl">${esc(x[0])}</div>
  <div class="row" style="justify-content:space-between"><div class="big" id="clkVal" aria-live="off">${fmt(left)}</div>
  <div class="row" style="gap:8px"><button class="btn" data-act="clk">${clock.run?'Pausa':(left<=0?'Repetir':'Iniciar')}</button><button class="btn ghost sm" data-act="clkreset" aria-label="Reiniciar el turno">↺</button><button class="btn ghost sm" data-act="clknext">Siguiente ›</button></div></div>
  <div class="sub">${esc(x[1])} · ${x[2]} min</div></div>`;
}
function tick(){
  const n = Date.now(); clock.left -= (n-clock.last)/1000; clock.last = n;
  const el = document.getElementById('clkVal'), box = document.getElementById('clock');
  if(clock.left <= 0){ clock.left = 0; stopClock(); try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){} toast('¡Tiempo! Termina tu frase y cede la palabra.'); if(S.tab==='debate') render(true); return; }
  if(el) el.textContent = fmt(clock.left);
  if(box) box.classList.toggle('warn', clock.left<=30);
}
function startClock(){ const full = CONFIG.turnos[clock.i][2]*60; if(clock.left===null || clock.left<=0) clock.left = full; clock.run = true; clock.last = Date.now(); clearInterval(clock.iv); clock.iv = setInterval(tick, 250); }
function stopClock(){ clock.run = false; clearInterval(clock.iv); }
function loadTurn(i){ stopClock(); clock.i = Math.max(0, Math.min(CONFIG.turnos.length-1, i)); clock.left = null; S.turno = clock.i; save(); }

/* ---------- PAUTA y VEREDICTO (jurado) ---------- */
function puntos(eq, d){ d = d || D(); const p = d.pauta || {}; let t = 0, n = 0; CONFIG.criterios.forEach((c,i)=>{ if(p[eq+'_'+i]){ t += +p[eq+'_'+i]; n++; } }); return { t: t - (+(d['falsos_'+eq]||0)), n }; }
function vPauta(){
  const p = D().pauta || {}, L = CONFIG.lados, max = CONFIG.criterios.length * 3;
  const hechos = L.reduce((a,eq)=>a+puntos(eq).n, 0), total = L.length * CONFIG.criterios.length;
  return `<div class="card tint"><h2>Pauta de evaluación</h2><p style="margin:0">Puntúa a ambos equipos en cada criterio: 3 logrado, 2 en desarrollo, 1 inicial. Máximo ${max} puntos. Llevas <b>${hechos} de ${total}</b> puntajes.</p></div>
  ${CONFIG.criterios.map((c,i)=>`<div class="crit"><h3>${esc(c[0])}</h3><div class="lv"><b>3:</b> ${esc(c[1])} · <b>2:</b> ${esc(c[2])} · <b>1:</b> ${esc(c[3])}</div>
    ${L.map(eq=>`<div class="score"><span class="who" style="color:${lado(eq).color}" title="${esc(lado(eq).nombre)}">${esc(corto(lado(eq).nombre))}</span>${[1,2,3].map(n=>`<button class="${+p[eq+'_'+i]===n?'on':''}" data-act="score" data-v="${eq}|${i}|${n}" aria-pressed="${+p[eq+'_'+i]===n}" aria-label="${esc(c[0])}, ${esc(lado(eq).nombre)}: ${n}">${n}</button>`).join('')}</div>`).join('')}
  </div>`).join('')}
  <div class="card"><h3>Descuentos de la prensa (−1 por dato falso)</h3>
    ${L.map(eq=>`<div class="row" style="justify-content:space-between;margin:6px 0"><b style="color:${lado(eq).color}">${esc(lado(eq).nombre)}</b><div class="counter"><button data-act="fals" data-v="${eq}|-1" aria-label="Quitar un descuento">−</button><b>${+(D()['falsos_'+eq]||0)}</b><button data-act="fals" data-v="${eq}|1" aria-label="Sumar un descuento">+</button></div></div>`).join('')}
  </div>
  <div class="tot">${L.map(eq=>{ const r = puntos(eq); return `<div class="box" style="background:${lado(eq).color}">${esc(lado(eq).nombre)}<b>${r.t}</b>de ${max}${r.n<CONFIG.criterios.length?` · faltan ${CONFIG.criterios.length-r.n}`:''}</div>`; }).join('')}</div>`;
}
function vVeredicto(){
  const L = CONFIG.lados, a = puntos(L[0]), b = puntos(L[1]), C = CONFIG.criterios.length;
  const completa = a.n === C && b.n === C;
  const lead = !completa ? `Falta completar la pauta (${a.n + b.n} de ${C*2} puntajes).`
    : a.t === b.t ? 'Empate: el jurado debe desempatar con el mejor argumento.'
    : 'Según la pauta, gana ' + (a.t > b.t ? lado(L[0]).nombre : lado(L[1]).nombre) + '.';
  return `<div class="tot">${L.map((eq,i)=>`<div class="box" style="background:${lado(eq).color}">${esc(lado(eq).nombre)}<b>${(i?b:a).t}</b>puntos</div>`).join('')}</div>
  <div class="card ${completa?'dark':'warn'}"><h3>${esc(lead)}</h3>${completa?'<p class="small" style="color:#D6E0F5;margin:0">El jurado no decide quién «tiene la razón», sino qué equipo argumentó mejor con evidencia.</p>':'<button class="btn sm" data-act="tab" data-v="pauta">Ir a la pauta</button>'}</div>
  <div class="card"><label class="lb">Equipo ganador</label><div class="seg">${[lado(L[0]).nombre, lado(L[1]).nombre, 'Empate'].map(o=>`<button class="${getP('ganador')===o?'on':''}" data-act="set" data-p="ganador" data-v="${esc(o)}" aria-pressed="${getP('ganador')===o}">${esc(o)}</button>`).join('')}</div>
    <label class="lb" for="vma">El mejor argumento del debate (de cualquier equipo)</label><textarea id="vma" data-bind="mejor_arg">${val('mejor_arg')}</textarea>

  </div>`;
}

/* ---------- VERIFICAR y TITULAR (prensa) ---------- */
function vVerificar(){
  const d = D(), list = (d.verif || []).slice().reverse(), L = CONFIG.lados;
  const f = d.vForm || { quien: lado(L[0]).nombre, ver: 'Correcto' };

/* =====================================================================
   BITÁCORA EXPORTABLE y RESUMEN PARA EL PANEL DEL PROFE
   ===================================================================== */
function bloques(eq, d){
  const t = CONFIG.equipos[eq], g = p => (getP(p, d)||'').toString().trim(), out = [];
  const push = (k, v) => { v = (v==null?'':String(v)).trim(); if(v) out.push([k, v]); };
  push('Rol', d.rol); push('Voto inicial', d.voto_inicial);
  if(t.tipo === 'debate'){
    push('Evidencia marcada', t.evidencia.filter((e,i)=>(d.usados||{})[i]).map(e=>e[0]).join(' · '));
    [0,1,2].forEach(i=>{ if(!argLleno(i, d)) return; const ev = getP('args.'+i+'.ev', d); push('Argumento '+(i+1)+(d.mejor===String(i+1)?' (el más sólido)':''), ['A: '+(g('args.'+i+'.af')||'—'), 'E: '+(ev!==undefined&&ev!==''&&t.evidencia[+ev]?t.evidencia[+ev][0]+' — ':'')+(g('args.'+i+'.evtxt')||'—'), 'R: '+(g('args.'+i+'.ra')||'—')].join('\n')); });
    [0,1].forEach(i=>{ if(g('rival.'+i+'.arg')) push('Rival '+(i+1), g('rival.'+i+'.arg')+'\nRespuesta: '+(g('rival.'+i+'.resp')||'—')); });
    push('Preguntas cruzadas', [g('preg.0'), g('preg.1')].filter(Boolean).join('\n'));
  }
  if(t.tipo === 'jurado'){
    const p = d.pauta || {};
    push('Pauta', CONFIG.criterios.map((c,i)=>c[0]+': '+CONFIG.lados.map(l=>corto(lado(l).nombre)+' '+(p[l+'_'+i]||'—')).join(' · ')).join('\n')+'\nDescuentos: '+CONFIG.lados.map(l=>corto(lado(l).nombre)+' '+(d['falsos_'+l]||0)).join(' · '));
    push('Total', CONFIG.lados.map(l=>lado(l).nombre+' '+puntos(l, d).t).join(' · '));
    push('Ganador', d.ganador); push('Mejor argumento', d.mejor_arg); push('Justificación', d.justif);
  }
  if(t.tipo === 'prensa'){
    push('Datos verificados', (d.verif||[]).map(x=>'['+x.ver+'] '+x.quien+' (turno '+x.turno+'): '+x.dato+(x.fuente?' · '+x.fuente:'')).join('\n'));
    push('Titular', [g('tit.f'), g('tit.b')].filter(Boolean).join('\n'));
  }
  const tags = tagsDe(t.tipo);
  push('Observaciones del debate', (d.notas||[]).map(n=>'[Turno '+n.turno+' · '+n.hora+'] '+((tags.find(x=>x[0]===n.tag)||['',n.tag])[1])+': '+n.txt).join('\n'));
  push('Voto final', d.voto_final);
  push('Reflexión', [g('refl.duda')&&'Me hizo dudar: '+g('refl.duda'), g('refl.falta')&&'Me faltó: '+g('refl.falta'), g('refl.medida')&&'Propuesta: '+g('refl.medida')].filter(Boolean).join('\n'));
  return out;
}
function exportText(){
  const t = team(), L = [];
  L.push('BITÁCORA DEL DEBATE · ' + CONFIG.titulo.toUpperCase(), 'Moción: «' + CONFIG.mocion + '»', 'Nombre: ' + (S.nombre||'—'), 'Equipo: ' + t.nombre + ' (' + t.postura + ')', 'Fecha: ' + new Date().toLocaleDateString('es-CL'), '');
  const b = bloques(S.equipo, D());
  if(!b.length) L.push('(Todavía no hay nada escrito.)');
  b.forEach(([k,v])=>L.push('== ' + k.toUpperCase() + ' ==', v, ''));
  return L.join('\n');
}
window.AUTOGUARDADO_RESUMEN = function(){
  if(!CONFIG) return {};
  const det = [], av = [];
  det.push({ k: 'Nombre', v: S.nombre || '—' });
  if(S.equipo) det.push({ k: 'Equipo actual', v: lado(S.equipo).nombre });
  Object.keys(CONFIG.equipos).forEach(eq=>{
    const d = (S.datos||{})[eq]; if(!d || !Object.keys(d).length) return;
    const t = CONFIG.equipos[eq];
    bloques(eq, d).forEach(([k,v])=>det.push({ k: t.nombre + ' · ' + k, v }));
    if(t.tipo === 'debate') av.push(corto(t.nombre) + ': ' + [0,1,2].filter(i=>argLleno(i, d) === 3).length + '/3 arg.');
    if(t.tipo === 'jurado') av.push('Jurado: ' + (d.ganador ? 'veredicto' : 'pauta'));
    if(t.tipo === 'prensa') av.push('Prensa: ' + (d.verif||[]).length + ' datos');
  });
  return { avance: av.join(' · ').slice(0, 60) || 'Sin avance', detalle: det.slice(0, 80) };
};

function armar(b, txt){ if(b.dataset.arm==='1') return true; b.dataset.arm = '1'; const o = b.textContent; b.textContent = txt; setTimeout(()=>{ if(b.isConnected){ b.dataset.arm = ''; b.textContent = o; } }, 2800); return false; }
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  switch(a){
    case 'enter': if((S.nombre||'').trim().length<2){ toast('Escribe tu nombre primero'); return; } S.equipo = v; S.tab = 'guia'; S.rol = getP('rol') || ''; save(); render(); window.scrollTo(0,0); break;
    case 'tab': S.tab = v; save(); render(); window.scrollTo(0,0); break;
    case 'home': S.tab = 'guia'; S.equipo = null; save(); render(); window.scrollTo(0,0); break;
    case 'rol': S.rol = v; setP('rol', v); save(); render(true); break;
    case 'set': setP(b.dataset.p, v); save(); render(true); break;
    case 'use': { const u = D().usados || (D().usados = {}); u[v] = !u[v]; save(); render(true); break; }
    case 'ntag': D().noteTag = v; save(); render(true); break;
    case 'addnote': { const txt = (D().noteDraft||'').trim(); if(!txt){ toast('Escribe algo primero'); return; }
      (D().notas || (D().notas = [])).push({ id: uid(), tag: D().noteTag || tagsDe(team().tipo)[0][0], txt: txt.slice(0, 1000), turno: clock.i+1, hora: hhmm() });
      D().noteDraft = ''; save(); render(true); toast('Nota guardada'); break; }
    case 'delnote': if(!armar(b, '¿seguro?')) return; D().notas = (D().notas||[]).filter(n=>n.id!==v); save(); render(true); break;
    case 'turn': loadTurn(+v); render(true); break;
    case 'clk': clock.run ? stopClock() : startClock(); render(true); break;
    case 'clkreset': stopClock(); clock.left = null; render(true); break;
    case 'clknext': if(clock.i >= CONFIG.turnos.length-1){ toast('Ese fue el último turno'); return; } loadTurn(clock.i+1); render(true); break;
    case 'score': { const [eq,i,n] = v.split('|'); const p = D().pauta || (D().pauta = {}); p[eq+'_'+i] = (+p[eq+'_'+i] === +n) ? 0 : +n; save(); render(true); break; }
    case 'fals': { const [eq,dl] = v.split('|'); const k = 'falsos_'+eq; D()[k] = Math.max(0, (+(D()[k]||0)) + (+dl)); save(); render(true); break; }
    case 'vq': D().vForm = Object.assign(D().vForm||{quien:lado(CONFIG.lados[0]).nombre,ver:'Correcto'}, {quien:v}); save(); render(true); break;
    case 'vv': D().vForm = Object.assign(D().vForm||{quien:lado(CONFIG.lados[0]).nombre,ver:'Correcto'}, {ver:v}); save(); render(true); break;
    case 'pickev': { const [eq,j] = v.split('|'), ev = lado(eq).evidencia[+j];
      D().vDato = ev[0] + ': ' + ev[1]; D().vFuente = 'Ficha ' + lado(eq).nombre + (ev[2] ? ' · ' + ev[2] : '');
      D().vForm = Object.assign(D().vForm||{}, { ver: 'Correcto' }); if(!D().vForm.quien) D().vForm.quien = lado(CONFIG.lados[0]).nombre;
      save(); render(); const c = document.getElementById('vCard'); if(c){ const hTop = (document.querySelector('.top')||{offsetHeight:0}).offsetHeight; window.scrollTo(0, c.getBoundingClientRect().top + window.scrollY - hTop - 10); }
      toast('Elige quién lo dijo y toca «Registrar dato»'); break; }
    case 'addv': { const d = D(), dato = (d.vDato||'').trim(); if(!dato){ toast('Escribe el dato que se dijo'); return; }
      const f = d.vForm || {quien:lado(CONFIG.lados[0]).nombre,ver:'Correcto'};
      (d.verif || (d.verif = [])).push({ id: uid(), dato: dato.slice(0, 600), quien: f.quien || lado(CONFIG.lados[0]).nombre, ver: f.ver || 'Correcto', fuente: (d.vFuente||'').trim().slice(0, 200), turno: clock.i+1, hora: hhmm() });
      d.vDato = ''; d.vFuente = ''; save(); render(true); toast('Dato registrado'); break; }
    case 'delv': if(!armar(b, '¿seguro?')) return; D().verif = (D().verif||[]).filter(x=>x.id!==v); save(); render(true); break;
    case 'print': { const p = document.getElementById('print'); p.innerHTML = `<h1>${esc(CONFIG.titulo)}</h1><pre>${esc(exportText())}</pre>`; window.print(); break; }
    case 'download': { const blob = new Blob([exportText()], {type:'text/plain;charset=utf-8'}); const a2 = document.createElement('a'); a2.href = URL.createObjectURL(blob); a2.download = 'bitacora-debate-' + ((S.nombre||'estudiante').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'estudiante') + '.txt'; document.body.appendChild(a2); a2.click(); setTimeout(()=>{ URL.revokeObjectURL(a2.href); a2.remove(); }, 800); break; }
    case 'copy': copiar(exportText(), 'Bitácora copiada'); break;
    case 'leave': stopClock(); S.equipo = null; S.tab = 'guia'; save(); render(); window.scrollTo(0,0); break;
    case 'wipe': if(!armar(b, 'Toca otra vez para borrar')) return; stopClock(); S = DEF(); save(); render(); window.scrollTo(0,0); toast('Datos borrados de este dispositivo'); break;
    case 'entrarcuenta': if(window.DF) DF.entrar().catch(err=>{ if(!err||!err.cancelado) toast('No se pudo entrar: '+((err&&err.message)||err)); }); break;
    case 'salircuenta': { const chipBtn = document.querySelector('.ag-chip [data-ag="salir"]'); if(chipBtn){ chipBtn.click(); } else if(window.DF){ DF.salir().then(()=>location.reload()); } break; }
    case 'edicon': { const o = edLoad(); o[b.dataset.k] = v; edSave(o); render(true); break; }
    case 'edcopy': copiar(edEnlace(edLoad()), 'Enlace copiado'); break;
    case 'edreset': if(!armar(b, 'Toca otra vez para borrar el borrador')) return; edSave({}); render(); window.scrollTo(0,0); break;
  }
});
document.addEventListener('keydown', e=>{ if((e.key==='Enter'||e.key===' ') && e.target.matches && e.target.matches('li[data-act]')){ e.preventDefault(); e.target.click(); } });
function copiar(txt, ok){ (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast(ok), ()=>{ const ta = document.createElement('textarea'); ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast(ok); }catch(err){ toast('No se pudo copiar: selecciona el texto y cópialo'); } ta.remove(); }); }

let edT = null;
document.addEventListener('input', e=>{
  const el = e.target;
  if(el.dataset.home === 'nombre'){ S.nombre = el.value; save(); const ok = el.value.trim().length >= 2; document.querySelectorAll('[data-act="enter"]').forEach(b=>b.disabled = !ok); const h = document.getElementById('nombreHint'); if(h) h.textContent = ok ? 'Listo: ahora elige tu equipo.' : 'Escríbelo para poder entrar a tu equipo.'; return; }
  if(el.dataset.draft){ D()[el.dataset.draft] = el.value; save(); return; }
  if(el.dataset.ed){ const o = edLoad(); o[el.dataset.ed] = el.value; edSave(o); clearTimeout(edT); edT = setTimeout(()=>{ const out = document.getElementById('edOut'); const need = !!out !== !!(((o.m||'').trim()) && ((o.an||'').trim()) && ((o.bn||'').trim())); if(need) render(true); else if(out){ out.textContent = edEnlace(o); const a = out.parentNode.querySelector('a.btn'); if(a) a.href = edEnlace(o); } }, 500); return; }
  if(el.dataset.bind){ setP(el.dataset.bind, el.value); save();
    const m = el.closest('.arg'); if(m){ const i = el.dataset.bind.split('.')[1]; m.querySelector('.meter i').style.width = (argLleno(i)/3*100)+'%'; } }
});
document.addEventListener('change', e=>{ const el = e.target; if(el.tagName==='SELECT' && el.dataset.bind){ setP(el.dataset.bind, el.value); save();
  const m = /^args\.(\d)\.ev$/.exec(el.dataset.bind);
  if(m && el.value!==''){ const k = 'args.'+m[1]+'.evtxt', ev = team().evidencia[+el.value]; if(ev && !(getP(k)||'').trim()){ setP(k, ev[1]+(ev[2]?' (Fuente: '+ev[2]+')':'')); save(); const ta = document.querySelector('[data-bind="'+k+'"]'); if(ta){ ta.value = getP(k); ta.dispatchEvent(new Event('input',{bubbles:true})); } } } } });
function afterRender(){ if(clock.run){ const el = document.getElementById('clkVal'); if(el) el.textContent = fmt(clock.left); } }

/* =====================================================================
   ARRANQUE
   ===================================================================== */
if(CONFIG){
  document.title = CONFIG.titulo + ' · Debate';
  /* guardado en la cuenta: firebase/autoguardado.js con la clave de este debate */
  if(window.DF){
    const sc = document.createElement('script');
    sc.src = '../firebase/autoguardado.js';
    sc.setAttribute('data-clave', CONFIG.clave);
    sc.setAttribute('data-titulo', 'Debate · ' + CONFIG.titulo);
    sc.setAttribute('data-claves', KEY);
    document.body.appendChild(sc);
  }
}
conectarCuenta();
render();
</script>
