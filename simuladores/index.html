<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simuladores · El Mundo de Felipe</title>
<style>
:root{--bg:#0a0c10;--card:#12161d;--line:#232a36;--bone:#f2efe6;--mute:#9aa3b2;--acid:#ccff00;--cyan:#22e3ff;--pink:#ff2e7e;--gold:#e9b949}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 15% 0,#141a24 0,var(--bg) 45%);color:var(--bone);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:28px 16px 60px}
.back{display:inline-block;color:var(--acid);text-decoration:none;font-size:.8rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:18px}
.back:hover{text-decoration:underline}
h1{font-size:clamp(1.8rem,5vw,2.8rem);margin:0 0 6px;letter-spacing:-1px}
h1 span{color:var(--acid)}
.sub{color:var(--mute);margin:0 0 24px;max-width:60ch}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.filters button{font:inherit;font-size:.8rem;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mute);cursor:pointer}
.filters button:hover{border-color:var(--acid);color:var(--bone)}
.filters button.on{background:var(--acid);color:#0a0c00;border-color:var(--acid);font-weight:700}
.group{margin-bottom:34px}
.group h2{font-size:.8rem;letter-spacing:3px;text-transform:uppercase;color:var(--acid);margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-decoration:none;color:inherit;transition:.2s;border-top:3px solid var(--c,var(--acid))}
.card:hover{transform:translateY(-3px);border-color:var(--c,var(--acid));box-shadow:0 12px 30px #0008}
.tag{align-self:flex-start;font-size:.65rem;letter-spacing:2px;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:#ffffff0d;color:var(--c,var(--acid));margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:1.05rem}
.card p{margin:0 0 14px;color:var(--mute);font-size:.88rem;line-height:1.5;flex:1}
.go{font-size:.78rem;font-weight:700;color:var(--c,var(--acid))}
.bio{--c:#7ddc8a}.fis{--c:var(--cyan)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← Volver al sitio</a>
  <h1>Simuladores <span>interactivos</span></h1>
  <p class="sub">Laboratorios virtuales para explorar los contenidos de clase: cambia las variables y observa qué pasa.</p>
  <div class="filters" id="f">
    <button class="on" data-f="todos">Todos</button>
    <button data-f="bio">Biología</button>
    <button data-f="fis">Física</button>
  </div>
  <div id="list"></div>
</div>
<script>
/* Para agregar un simulador nuevo: copia su .html a esta carpeta y añade una línea aquí. */
var SIMS=[
 {curso:'4° Medio',m:'bio',t:'Laboratorio de herencia',d:'Laboratorio de herencia mendeliana: genes, alelos y cruzamientos.',f:'gen.html'},
 {curso:'3° Medio',m:'bio',t:'Bosque esclerófilo',d:'Sucesión ecológica y red trófica del bosque de la zona central de Chile.',f:'bosque.html'},
 {curso:'3° Medio',m:'bio',t:'Simulador de ladera',d:'Un mismo cerro, dos laderas: energía solar, humedad del suelo y vegetación.',f:'simuladorladera.html'},
 {curso:'1° Medio',m:'fis',t:'Sismos, ondas y tsunamis',d:'Repaso con simulador de subducción: cómo se generan sismos y tsunamis.',f:'sismos.html'},
 {curso:'8° Básico',m:'bio',t:'Difusión y ósmosis (laboratorio 3D)',d:'Difusión, transporte de membrana y ósmosis con variables ajustables.',f:'difusion.html'},
 {curso:'8° Básico',m:'bio',t:'Sesión 9 · Difusión y ósmosis',d:'Actividad guiada de la sesión 9 sobre el movimiento de agua y solutos.',f:'osmosis.html'},
 {curso:'8° Básico',m:'fis',t:'Equilibrio térmico',d:'Intercambio de calor entre cuerpos hasta alcanzar una misma temperatura.',f:'equilibrio.html'},
 {curso:'7° Básico',m:'bio',t:'Operación Barrera',d:'Las barreras de defensa del organismo frente a microorganismos patógenos.',f:'operacionbarrera.html'}
];
var ORDER=['1° Medio','2° Medio','3° Medio','4° Medio','6° Básico','7° Básico','8° Básico'];
var cur='todos';
function render(){
  var h='';
  ORDER.slice().reverse().forEach(function(c){
    var xs=SIMS.filter(function(s){return s.curso===c&&(cur==='todos'||s.m===cur)});
    if(!xs.length)return;
    h+='<section class="group"><h2>'+c+'</h2><div class="grid">'+xs.map(function(s){
      return '<a class="card '+s.m+'" href="'+s.f+'"><span class="tag">'+(s.m==='bio'?'Biología':'Física')+'</span><h3>'+s.t+'</h3><p>'+s.d+'</p><span class="go">Abrir simulador →</span></a>';
    }).join('')+'</div></section>';
  });
  document.getElementById('list').innerHTML=h||'<p class="sub">No hay simuladores en esta categoría.</p>';
}
document.getElementById('f').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  cur=b.dataset.f;
  [].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)});
  render();
});
render();
</script>
</body>
</html>
