<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integración · Test 1</title>
<style>
  body{margin:0;background:#14110c;color:#f3e9d2;font:400 16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;padding:24px}
  h1{font-size:18px;margin:0 0 4px}
  p{color:#b7a888;margin:0 0 18px;font-size:14px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  button{font:inherit;font-size:14px;color:#f3e9d2;background:#332b20;border:2px solid #4a3f2f;border-bottom-color:#17130d;border-right-color:#17130d;padding:7px 12px;cursor:pointer}
  input{font:inherit;font-size:14px;color:#f3e9d2;background:#2a241b;border:2px solid #3b3125;padding:7px 10px;flex:1;min-width:120px}
  code{background:#2a241b;padding:1px 5px;border:1px solid #3b3125;font-size:13px}
  #log{font-size:13px;color:#8bc34a;min-height:1.4em}
</style>
</head>
<body>
<h1>Integración del server Test 1</h1>
<p>Así queda el widget dentro de otra página, y así se le mandan órdenes desde fuera.</p>

<div id="hueco"></div>

<div class="bar">
  <button data-a="start">Encender</button>
  <button data-a="stop">Apagar</button>
  <button data-a="restart">Reiniciar</button>
</div>
<div class="bar">
  <input id="txt" placeholder="Mensaje al chat" maxlength="200">
  <button id="say">Enviar</button>
</div>
<div class="bar">
  <input id="url" placeholder="Dirección del puente">
  <input id="key" type="password" placeholder="Clave">
  <button id="save">Conectar</button>
</div>
<p id="log">esperando estado…</p>

<script src="bridge.js"></script>
<script>
  const mc = MCTest1.mount(document.getElementById("hueco"), {
    src: "../embed.html",
    height: 340,
    onState: (s) => {
      document.getElementById("log").textContent =
        (s.online ? "abierto" : "cerrado") + " · " + s.count + "/" + s.max + " jugando · " + s.hours + " h";
    }
  });

  document.querySelectorAll("[data-a]").forEach((b) =>
    b.addEventListener("click", () => mc.action(b.dataset.a))
  );
  document.getElementById("save").addEventListener("click", () => {
    mc.config(document.getElementById("url").value.trim(), document.getElementById("key").value.trim());
    document.getElementById("log").textContent = "puente configurado";
  });
  document.getElementById("say").addEventListener("click", () => {
    const v = document.getElementById("txt").value.trim();
    if (v) mc.say(v);
  });
</script>
</body>
</html>
