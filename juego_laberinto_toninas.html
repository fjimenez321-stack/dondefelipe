<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>La Tonina de Amanda · Laberinto</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:linear-gradient(160deg,#001020 0%,#001e38 55%,#003050 100%);
  min-height:100vh;font-family:'Segoe UI',Tahoma,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  padding:8px;gap:6px;user-select:none;
}
h1{color:#fff;font-size:1.2rem;text-align:center;
   text-shadow:0 2px 10px rgba(0,0,0,.5);margin-top:2px;letter-spacing:.3px;}
.sub{color:rgba(255,255,255,.6);font-size:.72rem;text-align:center;}

/* NIVELES */
.nivel-bar{display:flex;gap:5px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;
  width:100%;max-width:420px;padding-bottom:2px;}
.lvl-btn{flex-shrink:0;padding:4px 10px;border:2px solid rgba(255,255,255,.18);
  border-radius:10px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.55);
  font-size:.72rem;font-weight:600;cursor:pointer;transition:all .2s;
  -webkit-tap-highlight-color:transparent;}
.lvl-btn.active{border-color:#7ec8e3;color:#7ec8e3;background:rgba(126,200,227,.12);}
.lvl-btn:hover:not(.active){border-color:rgba(255,255,255,.35);color:#fff;}

/* INFO */
.info-bar{display:flex;gap:6px;justify-content:center;width:100%;max-width:420px;}
.pill{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.18);border-radius:14px;
  padding:4px 10px;color:#fff;font-size:.78rem;font-weight:600;
  display:flex;align-items:center;gap:4px;flex:1;justify-content:center;}
.pill .lbl{opacity:.55;font-size:.65rem;font-weight:400;}
.pill.pts{background:rgba(255,215,0,.15);border-color:rgba(255,215,0,.3);color:#ffd700;}
.pill.bonus{background:rgba(52,211,153,.15);border-color:rgba(52,211,153,.3);color:#34d399;}

/* CANVAS */
#canvas-wrap{position:relative;border-radius:12px;overflow:hidden;
  box-shadow:0 6px 30px rgba(0,0,0,.5),0 0 0 1.5px rgba(255,255,255,.08);}
canvas{display:block;}

/* OVERLAYS */
.overlay{display:none;position:absolute;inset:0;
  align-items:center;justify-content:center;
  flex-direction:column;gap:7px;text-align:center;padding:16px;}
.overlay.show{display:flex;}
#ov-win{background:rgba(0,20,40,.92);}
#ov-lose{background:rgba(20,0,0,.92);}
.ov-ico{font-size:2.5rem;}
.ov-titulo{font-size:1.1rem;font-weight:700;letter-spacing:.4px;}
#ov-win .ov-titulo{color:#ffd700;}
#ov-lose .ov-titulo{color:#f87171;}
.ov-msg{color:rgba(255,255,255,.8);font-size:.8rem;line-height:1.5;}
.ov-puntaje{border-radius:10px;padding:6px 16px;font-size:1rem;font-weight:700;}
#ov-win .ov-puntaje{background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.4);color:#ffd700;}
#ov-lose .ov-puntaje{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.35);color:#f87171;}
.ov-btns{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:3px;}
.ov-btn{padding:7px 16px;border:none;border-radius:10px;font-size:.8rem;
  font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.ov-btn.primary{background:#ffd700;color:#001a2e;}
.ov-btn.danger{background:#ef4444;color:#fff;}
.ov-btn.sec{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22);}

/* D-PAD */
.dpad{display:grid;grid-template-areas:". up ." "lt . rt" ". dn .";
  grid-template-columns:1fr 1fr 1fr;gap:5px;}
.dpad button{width:48px;height:48px;border:none;border-radius:12px;
  background:rgba(255,255,255,.13);backdrop-filter:blur(6px);
  color:#fff;font-size:1.15rem;cursor:pointer;
  border:1px solid rgba(255,255,255,.2);
  transition:background .1s,transform .1s;display:flex;
  align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;}
.dpad button:active{background:rgba(126,200,227,.35);transform:scale(.91);}
.d-up{grid-area:up;}.d-lt{grid-area:lt;}.d-rt{grid-area:rt;}.d-dn{grid-area:dn;}

/* NOTIFICACIÓN PUNTAJE */
.notif{position:absolute;font-size:.85rem;font-weight:700;color:#34d399;
  pointer-events:none;animation:floatUp .9s ease-out forwards;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-40px);}}

.btn-r{padding:7px 20px;background:rgba(255,255,255,.1);color:#fff;
  border:1px solid rgba(255,255,255,.22);border-radius:14px;
  font-size:.8rem;font-weight:600;cursor:pointer;transition:background .15s;
  -webkit-tap-highlight-color:transparent;}
.btn-r:hover{background:rgba(255,255,255,.2);}

/* LEYENDA */
.leyenda{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  background:rgba(255,255,255,.06);border-radius:10px;padding:6px 12px;
  max-width:420px;}
.ley-item{display:flex;align-items:center;gap:4px;font-size:.68rem;
  color:rgba(255,255,255,.65);}
.ley-ico{font-size:.85rem;}
</style>
</head>
<body>

<h1>🐬 La Tonina de Amanda</h1>
<p class="sub">¡Encuentra el pez sin toparte con depredadores ni perderte!</p>

<div class="nivel-bar" id="nivel-bar"></div>

<div class="info-bar">
  <div class="pill"><span>⏱</span><span id="inf-t">0:00</span><span class="lbl">tiempo</span></div>
  <div class="pill"><span>👣</span><span id="inf-p">0</span><span class="lbl">pasos</span></div>
  <div class="pill bonus"><span>🐠</span><span id="inf-b">0</span><span class="lbl">bonus</span></div>
  <div class="pill pts"><span>⭐</span><span id="inf-s">—</span><span class="lbl">puntos</span></div>
</div>

<div id="canvas-wrap">
  <canvas id="c"></canvas>

  <div class="overlay" id="ov-win">
    <div class="ov-ico" id="ow-ico">🐟</div>
    <div class="ov-titulo" id="ow-tit">¡Encontraste el alimento!</div>
    <div class="ov-msg" id="ow-msg"></div>
    <div class="ov-puntaje" id="ow-pts"></div>
    <div class="ov-btns">
      <button class="ov-btn primary" id="btn-sig">Siguiente →</button>
      <button class="ov-btn sec"     onclick="init()">🔄 Reintentar</button>
    </div>
  </div>

  <div class="overlay" id="ov-lose">
    <div class="ov-ico" id="ol-ico">🦈</div>
    <div class="ov-titulo" id="ol-tit">¡Perdiste!</div>
    <div class="ov-msg"    id="ol-msg"></div>
    <div class="ov-puntaje" id="ol-pts"></div>
    <div class="ov-btns">
      <button class="ov-btn danger" onclick="init()">🔄 Intentar de nuevo</button>
    </div>
  </div>
</div>

<div class="dpad">
  <button class="d-up" onclick="mv(0,-1)">▲</button>
  <button class="d-lt" onclick="mv(-1,0)">◀</button>
  <button class="d-rt" onclick="mv(1,0)">▶</button>
  <button class="d-dn" onclick="mv(0,1)">▼</button>
</div>
<button class="btn-r" onclick="init()">🔄 Reiniciar nivel</button>

<div class="leyenda">
  <div class="ley-item"><span class="ley-ico">🐬</span>Tú</div>
  <div class="ley-item"><span class="ley-ico">🐟</span>Meta</div>
  <div class="ley-item"><span class="ley-ico">🦈</span>Depredador</div>
  <div class="ley-item"><span class="ley-ico">🐠</span>Pez bonus</div>
  <div class="ley-item"><span style="display:inline-block;width:14px;height:6px;background:#ef4444;border-radius:2px;"></span>Salida peligrosa</div>
</div>

<script>
/* ════════════════════════════════════════════
   NIVELES
════════════════════════════════════════════ */
const NIVELES = [
  { label:'1 ⭐',     cols:7,  rows:7,  base:500,  preds:1, traps:1, fish:2, rocks:3, seaweed:3 },
  { label:'2 ⭐⭐',   cols:9,  rows:9,  base:900,  preds:2, traps:2, fish:3, rocks:5, seaweed:4 },
  { label:'3 ⭐⭐⭐', cols:11, rows:11, base:1400, preds:3, traps:3, fish:4, rocks:7, seaweed:6 },
  { label:'4 🔥',     cols:13, rows:13, base:2000, preds:5, traps:4, fish:5, rocks:9, seaweed:8 },
  { label:'5 💀',     cols:15, rows:15, base:2800, preds:7, traps:6, fish:6, rocks:12,seaweed:10},
];
let nivelIdx = 0;

/* Estado */
let walls=[], px=0, py=0, dir='right', pasos=0;
let ganado=false, perdido=false;
let startTime=null, elapsed=0, timerInt=null;
let predators=[], smallFish=[], rockCells=[], seaweedCells=[], dangerExits=[];
let fishBonus=0;

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

/* ════════════════════════════════════════════
   UTILS
════════════════════════════════════════════ */
function shuf(a){ return [...a].sort(()=>Math.random()-.5); }
function csize(){ return Math.min(window.innerWidth-20, 400); }
function fmtT(s){ const m=Math.floor(s/60),sec=Math.floor(s%60); return `${m}:${sec.toString().padStart(2,'0')}`; }

/* ════════════════════════════════════════════
   GENERACIÓN LABERINTO (DFS)
════════════════════════════════════════════ */
function genMaze(cols,rows){
  const w=Array.from({length:rows},()=>Array.from({length:cols},()=>({t:true,r:true,b:true,l:true})));
  const vis=Array.from({length:rows},()=>new Array(cols).fill(false));
  const D=[[0,-1,'t','b'],[1,0,'r','l'],[0,1,'b','t'],[-1,0,'l','r']];
  function dfs(x,y){
    vis[y][x]=true;
    for(const [dx,dy,d1,d2] of shuf(D)){
      const nx=x+dx,ny=y+dy;
      if(nx>=0&&nx<cols&&ny>=0&&ny<rows&&!vis[ny][nx]){
        w[y][x][d1]=false; w[ny][nx][d2]=false; dfs(nx,ny);
      }
    }
  }
  dfs(0,0); return w;
}

/* ════════════════════════════════════════════
   COLOCAR ELEMENTOS
════════════════════════════════════════════ */
function placeCells(count, cols, rows, occupied){
  const all=[];
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++) if(!occupied.has(`${x},${y}`)) all.push({x,y});
  return shuf(all).slice(0,count);
}

function placeDangerExits(count, cols, rows){
  const borders=[];
  for(let x=2;x<cols;x++) borders.push({x,y:0,w:'t'});
  for(let x=0;x<cols-2;x++) borders.push({x,y:rows-1,w:'b'});
  for(let y=1;y<rows;y++) borders.push({x:0,y,w:'l'});
  for(let y=0;y<rows-1;y++) borders.push({x:cols-1,y,w:'r'});
  return shuf(borders).slice(0,count).map(e=>{
    walls[e.y][e.x][e.w]=false; return e;
  });
}

/* ════════════════════════════════════════════
   AUDIO
════════════════════════════════════════════ */
let mazAC=null;
function getMazAC(){
  if(!mazAC) mazAC=new(window.AudioContext||window.webkitAudioContext)();
  if(mazAC.state==='suspended') mazAC.resume(); return mazAC;
}
function _pn(f,t,dur,vol,type){
  const a=getMazAC(),o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.value=f;o.connect(g);g.connect(a.destination);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||0.18,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.01);
}
function playBonusSound(){
  const a=getMazAC(),t=a.currentTime;
  [523.25,659.25,783.99].forEach((f,i)=>_pn(f,t+i*0.08,0.18,0.18));
}
function playDeathSound(){
  const a=getMazAC(),t=a.currentTime;
  const o=a.createOscillator(),g=a.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(380,t);
  o.frequency.exponentialRampToValueAtTime(55,t+0.7);
  o.connect(g);g.connect(a.destination);
  g.gain.setValueAtTime(0.28,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.75);
  o.start(t);o.stop(t+0.8);
}

/* ════════════════════════════════════════════
   VALIDACIÓN DE CAMINO (BFS)
════════════════════════════════════════════ */
function pathExists(){
  const cfg=NIVELES[nivelIdx];
  const sharks=new Set(predators.map(p=>`${p.x},${p.y}`));
  const goal=`${cfg.cols-1},${cfg.rows-1}`;
  const D=[[0,-1,'t'],[1,0,'r'],[0,1,'b'],[-1,0,'l']];
  const visited=new Set(['0,0']),queue=[{x:0,y:0}];
  while(queue.length){
    const {x,y}=queue.shift();
    if(`${x},${y}`===goal) return true;
    for(const [dx,dy,wall] of D){
      const nx=x+dx,ny=y+dy;
      if(nx<0||nx>=cfg.cols||ny<0||ny>=cfg.rows) continue;
      if(walls[y][x][wall]) continue;
      const k=`${nx},${ny}`;
      if(visited.has(k)||sharks.has(k)) continue;
      visited.add(k);queue.push({x:nx,y:ny});
    }
  }
  return false;
}

/* ════════════════════════════════════════════
   TIMER & PUNTUACIÓN
════════════════════════════════════════════ */
function startTimer(){ if(startTime) return; startTime=Date.now(); timerInt=setInterval(tick,200); }
function stopTimer(){ clearInterval(timerInt); timerInt=null; }
function tick(){
  elapsed=(Date.now()-startTime)/1000;
  updInfo();
}
function calcScore(){
  const cfg=NIVELES[nivelIdx];
  const minP=cfg.cols+cfg.rows-2;
  return Math.max(0, cfg.base - Math.max(0,(pasos-minP)*4) - Math.floor(elapsed*2)) + fishBonus;
}
function updInfo(){
  document.getElementById('inf-t').textContent=fmtT(elapsed);
  document.getElementById('inf-p').textContent=pasos;
  document.getElementById('inf-b').textContent=fishBonus;
  if(startTime&&!ganado&&!perdido) document.getElementById('inf-s').textContent=calcScore();
}

/* ════════════════════════════════════════════
   INICIALIZAR
════════════════════════════════════════════ */
function buildLevelBar(){
  const bar=document.getElementById('nivel-bar');
  bar.innerHTML=NIVELES.map((n,i)=>
    `<button class="lvl-btn${i===nivelIdx?' active':''}" onclick="setNivel(${i},this)">${n.label}</button>`
  ).join('');
}
function setNivel(idx,btn){
  nivelIdx=idx;
  document.querySelectorAll('.lvl-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  init();
}

function init(){
  stopTimer();
  const sz=csize(); const cfg=NIVELES[nivelIdx];
  canvas.width=canvas.height=sz;
  walls=genMaze(cfg.cols,cfg.rows);
  px=0; py=0; dir='right'; pasos=0; fishBonus=0;
  ganado=false; perdido=false; startTime=null; elapsed=0;

  // Depredadores: reintentar hasta garantizar camino libre al objetivo
  let occupied=new Set(['0,0',`${cfg.cols-1},${cfg.rows-1}`]);
  for(let y=0;y<Math.min(3,cfg.rows);y++) for(let x=0;x<Math.min(3,cfg.cols);x++) occupied.add(`${x},${y}`);
  let pathOk=false,pathTries=0;
  while(!pathOk&&pathTries<40){
    predators=placeCells(cfg.preds,cfg.cols,cfg.rows,occupied);
    pathOk=pathExists(); pathTries++;
  }
  predators.forEach(p=>occupied.add(`${p.x},${p.y}`));

  smallFish = placeCells(cfg.fish, cfg.cols, cfg.rows, occupied).map(p=>({...p,eaten:false}));
  smallFish.forEach(p=>occupied.add(`${p.x},${p.y}`));

  // Decorations can overlap path cells (visual only)
  const anyOccupied=new Set([...occupied]);
  rockCells    = placeCells(cfg.rocks,   cfg.cols, cfg.rows, anyOccupied);
  seaweedCells = placeCells(cfg.seaweed, cfg.cols, cfg.rows, anyOccupied);

  dangerExits = placeDangerExits(cfg.traps, cfg.cols, cfg.rows);

  document.getElementById('inf-t').textContent='0:00';
  document.getElementById('inf-p').textContent='0';
  document.getElementById('inf-b').textContent='0';
  document.getElementById('inf-s').textContent='—';
  document.getElementById('ov-win').classList.remove('show');
  document.getElementById('ov-lose').classList.remove('show');

  document.getElementById('btn-sig').textContent = nivelIdx<NIVELES.length-1?'Siguiente nivel →':'¡Campeona! 🏆';
  document.getElementById('btn-sig').onclick = ()=>{ if(nivelIdx<NIVELES.length-1){nivelIdx++;buildLevelBar();init();} else init(); };

  draw();
}

/* ════════════════════════════════════════════
   DIBUJO — TONINA (lomo negro, vientre blanco)
════════════════════════════════════════════ */
function drawTonina(cx,cy,r,direction){
  ctx.save(); ctx.translate(cx,cy);
  const A={right:0,left:Math.PI,down:Math.PI/2,up:-Math.PI/2};
  ctx.rotate(A[direction]||0);

  const L=r*1.55, H=r*0.50;

  // Colas (flukes) — dibujadas antes del cuerpo
  for(const sy of [-1,1]){
    ctx.beginPath();
    ctx.moveTo(-L*0.92,0);
    ctx.bezierCurveTo(-L*1.05,H*0.55*sy,-L*1.42,H*0.98*sy,-L*1.3,H*0.65*sy);
    ctx.bezierCurveTo(-L*1.15,H*0.35*sy,-L*0.96,H*0.14*sy,-L*0.92,0);
    ctx.fillStyle='#0d1b2a'; ctx.fill();
  }

  // Silueta del cuerpo reutilizada para relleno y clip
  function bodyPath(){
    ctx.beginPath();
    ctx.moveTo(-L*0.92,0);
    // vientre
    ctx.bezierCurveTo(-L*0.55,H*0.92,L*0.2,H*0.96,L*0.65,H*0.46);
    // mandíbula inferior → hocico inferior
    ctx.bezierCurveTo(L*0.82,H*0.28,L*1.12,H*0.08,L*1.16,0);
    // hocico superior → melón (frente redondeada)
    ctx.bezierCurveTo(L*1.05,-H*0.2,L*0.82,-H*0.34,L*0.65,-H*0.42);
    ctx.bezierCurveTo(L*0.45,-H*0.68,L*0.14,-H*1.02,-L*0.02,-H);
    // lomo
    ctx.bezierCurveTo(-L*0.42,-H*0.98,-L*0.78,-H*0.66,-L*0.92,0);
    ctx.closePath();
  }

  // Cuerpo negro (lomo)
  bodyPath(); ctx.fillStyle='#111827'; ctx.fill();

  // Vientre blanco clipeado al cuerpo
  ctx.save();
  bodyPath(); ctx.clip();
  ctx.beginPath();
  ctx.moveTo(-L*0.76,H*0.28);
  ctx.bezierCurveTo(-L*0.4,H*1.02,L*0.22,H*1.02,L*0.65,H*0.46);
  ctx.bezierCurveTo(L*0.82,H*0.28,L*1.12,H*0.08,L*1.16,0);
  ctx.bezierCurveTo(L*1.0,H*0.38,L*0.52,H*0.72,L*0.08,H*0.76);
  ctx.bezierCurveTo(-L*0.28,H*0.78,-L*0.62,H*0.6,-L*0.76,H*0.28);
  ctx.fillStyle='#ecf0f4'; ctx.fill();
  ctx.restore();

  // Aleta dorsal triangular
  ctx.beginPath();
  ctx.moveTo(L*0.08,-H*0.96);
  ctx.bezierCurveTo(L*0.18,-H*1.88,L*0.52,-H*1.65,L*0.46,-H*0.96);
  ctx.bezierCurveTo(L*0.34,-H*0.97,L*0.13,-H*0.97,L*0.08,-H*0.96);
  ctx.fillStyle='#0a1520'; ctx.fill();

  // Aleta pectoral
  ctx.beginPath();
  ctx.moveTo(L*0.38,H*0.68);
  ctx.bezierCurveTo(L*0.18,H*1.2,-L*0.12,H*1.08,L*0.08,H*0.7);
  ctx.fillStyle='#0a1520'; ctx.fill();

  // Ojo
  ctx.beginPath(); ctx.arc(L*0.6,-H*0.22,r*0.12,0,Math.PI*2);
  ctx.fillStyle='#f8fafc'; ctx.fill();
  ctx.beginPath(); ctx.arc(L*0.615,-H*0.22,r*0.07,0,Math.PI*2);
  ctx.fillStyle='#030712'; ctx.fill();
  ctx.beginPath(); ctx.arc(L*0.632,-H*0.25,r*0.025,0,Math.PI*2);
  ctx.fillStyle='#fff'; ctx.fill();

  // Sonrisa característica del delfín
  ctx.beginPath();
  ctx.arc(L*0.93,H*0.04,H*0.26,0.28,Math.PI-0.28);
  ctx.strokeStyle='#1a3a5c'; ctx.lineWidth=r*0.045; ctx.stroke();

  ctx.restore();
}

/* ════════════════════════════════════════════
   DIBUJO — TIBURÓN (depredador)
════════════════════════════════════════════ */
function drawShark(cx,cy,r){
  ctx.save(); ctx.translate(cx,cy);

  // cola
  ctx.fillStyle='#374151';
  [[-1,-1],[-1,1]].forEach(([,sy])=>{
    ctx.beginPath(); ctx.moveTo(-r*1.3,0);
    ctx.lineTo(-r*1.85,r*.55*sy); ctx.lineTo(-r*1.5,0); ctx.fill();
  });

  // cuerpo gris
  ctx.beginPath(); ctx.ellipse(0,0,r*1.35,r*.58,0,0,Math.PI*2);
  ctx.fillStyle='#4b5563'; ctx.fill();

  // vientre blanco
  ctx.beginPath(); ctx.ellipse(r*.05,r*.15,r*.85,r*.32,0,0,Math.PI);
  ctx.fillStyle='#f3f4f6'; ctx.fill();

  // aleta dorsal alta
  ctx.beginPath(); ctx.moveTo(-r*.05,-r*.58);
  ctx.lineTo(r*.25,-r*1.3); ctx.lineTo(r*.55,-r*.58);
  ctx.fillStyle='#374151'; ctx.fill();

  // aleta pectoral
  ctx.beginPath(); ctx.moveTo(r*.1,r*.5);
  ctx.bezierCurveTo(-r*.2,r*.9,-r*.5,r*.7,-r*.2,r*.5);
  ctx.fillStyle='#374151'; ctx.fill();

  // dientes
  ctx.fillStyle='#fff';
  for(let i=0;i<3;i++){
    ctx.beginPath(); ctx.moveTo(r*.55+i*r*.12,r*.1);
    ctx.lineTo(r*.61+i*r*.12,r*.28); ctx.lineTo(r*.67+i*r*.12,r*.1); ctx.fill();
  }

  // ojo negro
  ctx.beginPath(); ctx.arc(r*.55,-r*.08,r*.1,0,Math.PI*2);
  ctx.fillStyle='#030712'; ctx.fill();
  ctx.beginPath(); ctx.arc(r*.58,-r*.1,r*.03,0,Math.PI*2);
  ctx.fillStyle='#fff'; ctx.fill();

  ctx.restore();
}

/* ════════════════════════════════════════════
   DIBUJO — PEZ META
════════════════════════════════════════════ */
function drawGoalFish(cx,cy,r){
  ctx.save(); ctx.translate(cx,cy);
  ctx.beginPath(); ctx.ellipse(0,0,r*.9,r*.55,0,0,Math.PI*2);
  ctx.fillStyle='#f97316'; ctx.fill();
  ctx.strokeStyle='#ea580c'; ctx.lineWidth=r*.06; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-r*.85,0); ctx.lineTo(-r*1.3,-r*.5); ctx.lineTo(-r*1.3,r*.5); ctx.closePath();
  ctx.fillStyle='#fb923c'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-r*.1,-r*.55); ctx.lineTo(r*.2,-r*.9); ctx.lineTo(r*.45,-r*.55);
  ctx.fillStyle='#fed7aa'; ctx.fill();
  ctx.beginPath(); ctx.arc(r*.4,-r*.08,r*.13,0,Math.PI*2);
  ctx.fillStyle='#fff'; ctx.fill();
  ctx.beginPath(); ctx.arc(r*.42,-r*.08,r*.08,0,Math.PI*2);
  ctx.fillStyle='#1e293b'; ctx.fill();
  ctx.restore();
}

/* ════════════════════════════════════════════
   DIBUJO — PEZ PEQUEÑO (bonus)
════════════════════════════════════════════ */
const FISH_COLORS=['#22d3ee','#a3e635','#fb7185','#fbbf24','#c084fc'];
function drawSmallFish(cx,cy,r,colorIdx){
  const col=FISH_COLORS[colorIdx%FISH_COLORS.length];
  ctx.save(); ctx.translate(cx,cy);
  ctx.beginPath(); ctx.ellipse(0,0,r*.7,r*.42,0,0,Math.PI*2);
  ctx.fillStyle=col; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-r*.65,0); ctx.lineTo(-r*1.05,-r*.38); ctx.lineTo(-r*1.05,r*.38); ctx.closePath();
  ctx.fillStyle=col; ctx.fill();
  ctx.beginPath(); ctx.arc(r*.25,-r*.07,r*.12,0,Math.PI*2);
  ctx.fillStyle='#fff'; ctx.fill();
  ctx.beginPath(); ctx.arc(r*.27,-r*.07,r*.07,0,Math.PI*2);
  ctx.fillStyle='#000'; ctx.fill();
  ctx.restore();
}

/* ════════════════════════════════════════════
   DIBUJO — ROCA
════════════════════════════════════════════ */
function drawRock(cx,cy,r){
  ctx.save(); ctx.translate(cx,cy);
  ctx.beginPath(); ctx.ellipse(0,r*.1,r*.72,r*.52,-0.2,0,Math.PI*2);
  ctx.fillStyle='#374151'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(-r*.18,-r*.08,r*.28,r*.18,-0.3,0,Math.PI*2);
  ctx.fillStyle='#4b5563'; ctx.fill();
  ctx.restore();
}

/* ════════════════════════════════════════════
   DIBUJO — ALGA
════════════════════════════════════════════ */
function drawSeaweed(cx,cy,r){
  ctx.save(); ctx.translate(cx,cy);
  ctx.strokeStyle='#15803d'; ctx.lineWidth=r*.15; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,r*.8);
  ctx.bezierCurveTo(r*.4,r*.4,-r*.3,0,r*.2,-r*.4);
  ctx.bezierCurveTo(r*.5,-r*.7,-r*.1,-r*.9,r*.1,-r*1.05);
  ctx.stroke();
  ctx.strokeStyle='#16a34a'; ctx.lineWidth=r*.1;
  ctx.beginPath(); ctx.moveTo(r*.15,r*.5);
  ctx.bezierCurveTo(-r*.25,r*.2,r*.15,-r*.1,-r*.05,-r*.35);
  ctx.stroke();
  ctx.restore();
}

/* ════════════════════════════════════════════
   DIBUJO PRINCIPAL
════════════════════════════════════════════ */
function draw(){
  const sz=canvas.width; const cfg=NIVELES[nivelIdx];
  const cols=cfg.cols, rows=cfg.rows;
  const cw=sz/cols, ch=sz/rows;

  ctx.clearRect(0,0,sz,sz);
  const bg=ctx.createLinearGradient(0,0,sz,sz);
  bg.addColorStop(0,'#001525'); bg.addColorStop(1,'#002a45');
  ctx.fillStyle=bg; ctx.fillRect(0,0,sz,sz);

  // Destellos en inicio y meta
  [{x:0,y:0,col:'rgba(100,210,255,.14)'},{x:cols-1,y:rows-1,col:'rgba(255,215,0,.18)'}].forEach(({x,y,col})=>{
    const g=ctx.createRadialGradient(x*cw+cw/2,y*ch+ch/2,0,x*cw+cw/2,y*ch+ch/2,cw*.9);
    g.addColorStop(0,col); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.fillRect(x*cw,y*ch,cw,ch);
  });

  // Algas (fondo)
  seaweedCells.forEach(p=>drawSeaweed(p.x*cw+cw/2, p.y*ch+ch*0.85, Math.min(cw,ch)*0.3));

  // Paredes
  ctx.strokeStyle='#3b82f6';
  ctx.lineWidth=Math.max(1.5,cw*.1); ctx.lineCap='round';
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
    const cx=x*cw, cy=y*ch, w=walls[y][x];
    if(w.t) seg(cx,cy,cx+cw,cy);
    if(w.l) seg(cx,cy,cx,cy+ch);
    if(x===cols-1&&w.r) seg(cx+cw,cy,cx+cw,cy+ch);
    if(y===rows-1&&w.b) seg(cx,cy+ch,cx+cw,cy+ch);
  }

  // Rocas
  rockCells.forEach(p=>drawRock(p.x*cw+cw/2, p.y*ch+ch*0.75, Math.min(cw,ch)*0.28));

  // Salidas peligrosas (borde rojo)
  dangerExits.forEach(e=>{
    const cx=e.x*cw, cy=e.y*ch;
    let x1,y1,x2,y2;
    if(e.w==='t'){x1=cx;y1=cy;x2=cx+cw;y2=cy;}
    else if(e.w==='r'){x1=cx+cw;y1=cy;x2=cx+cw;y2=cy+ch;}
    else if(e.w==='b'){x1=cx;y1=cy+ch;x2=cx+cw;y2=cy+ch;}
    else{x1=cx;y1=cy;x2=cx;y2=cy+ch;}
    ctx.strokeStyle='rgba(239,68,68,.75)'; ctx.lineWidth=Math.max(2,cw*.1);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    // señal de peligro
    ctx.fillStyle='rgba(239,68,68,.7)'; ctx.font=`${Math.min(cw,ch)*.45}px serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('⚠️',(x1+x2)/2,(y1+y2)/2);
  });

  // Peces pequeños (bonus)
  smallFish.forEach((f,i)=>{ if(!f.eaten) drawSmallFish(f.x*cw+cw/2, f.y*ch+ch/2, Math.min(cw,ch)*.28, i); });

  // Depredadores
  predators.forEach(p=>drawShark(p.x*cw+cw/2, p.y*ch+ch/2, Math.min(cw,ch)*.32));

  // Pez meta
  if(!perdido) drawGoalFish((cols-1)*cw+cw/2, (rows-1)*ch+ch/2, Math.min(cw,ch)*.32);

  // Tonina
  drawTonina(px*cw+cw/2, py*ch+ch/2, Math.min(cw,ch)*.34, dir);
}

function seg(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }

/* ════════════════════════════════════════════
   MOVIMIENTO
════════════════════════════════════════════ */
function mv(dx,dy){
  if(ganado||perdido) return;
  startTimer();
  const cfg=NIVELES[nivelIdx]; const nx=px+dx, ny=py+dy;

  // Fuera del laberinto
  if(nx<0||nx>=cfg.cols||ny<0||ny>=cfg.rows){
    const isDanger=dangerExits.some(e=>e.x===px&&e.y===py&&
      ((dx===1&&e.w==='r')||(dx===-1&&e.w==='l')||(dy===1&&e.w==='b')||(dy===-1&&e.w==='t')));
    if(isDanger){ perder('exit'); } return;
  }

  // Pared interna
  const w=walls[py][px];
  if(dx===1&&w.r)return; if(dx===-1&&w.l)return;
  if(dy===1&&w.b)return; if(dy===-1&&w.t)return;

  // Mover
  if(dx===1)dir='right'; else if(dx===-1)dir='left';
  else if(dy===1)dir='down'; else dir='up';
  px=nx; py=ny; pasos++;

  // Depredador
  if(predators.some(p=>p.x===px&&p.y===py)){ perder('predator'); return; }

  // Pez bonus
  const bf=smallFish.find(f=>f.x===px&&f.y===py&&!f.eaten);
  if(bf){ bf.eaten=true; fishBonus+=100; mostrarBonus(px,py,'+100'); playBonusSound(); }

  updInfo(); draw();
  if(px===cfg.cols-1&&py===cfg.rows-1) ganar();
}

/* ════════════════════════════════════════════
   GANAR / PERDER
════════════════════════════════════════════ */
function ganar(){
  ganado=true; stopTimer(); elapsed=(Date.now()-startTime)/1000;
  draw();
  const score=calcScore();
  document.getElementById('inf-s').textContent=score;
  const stars=score>=NIVELES[nivelIdx].base*.75?'⭐⭐⭐':score>=NIVELES[nivelIdx].base*.4?'⭐⭐':'⭐';
  document.getElementById('ow-tit').textContent='¡Encontraste el alimento!';
  document.getElementById('ow-msg').textContent=`${stars}  Tiempo: ${fmtT(elapsed)} · Pasos: ${pasos} · Bonus: +${fishBonus}`;
  document.getElementById('ow-pts').textContent=`${score} puntos`;
  setTimeout(()=>document.getElementById('ov-win').classList.add('show'),450);
}

function perder(causa){
  perdido=true; stopTimer(); playDeathSound(); draw();
  const msgs={
    predator:['🦈','¡Un tiburón te atrapó!','Esquiva a los depredadores del laberinto.'],
    exit:    ['🌊','¡Aguas peligrosas!','Esa salida llevaba a aguas llenas de depredadores.']
  };
  const [ico,tit,msg]=msgs[causa];
  document.getElementById('ol-ico').textContent=ico;
  document.getElementById('ol-tit').textContent=tit;
  document.getElementById('ol-msg').textContent=msg;
  document.getElementById('ol-pts').textContent=`Bonus acumulado: +${fishBonus} pts`;
  setTimeout(()=>document.getElementById('ov-lose').classList.add('show'),500);
}

/* Notificación flotante de bonus */
function mostrarBonus(gx,gy,txt){
  const cfg=NIVELES[nivelIdx]; const sz=canvas.width;
  const cw=sz/cfg.cols, ch=sz/cfg.rows;
  const rect=canvas.getBoundingClientRect();
  const el=document.createElement('div');
  el.className='notif'; el.textContent=txt;
  el.style.cssText=`left:${rect.left+gx*cw+cw/2}px;top:${rect.top+gy*ch}px;position:fixed;`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),950);
}

/* ════════════════════════════════════════════
   CONTROLES
════════════════════════════════════════════ */
document.addEventListener('keydown',e=>{
  const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
           w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
  if(m[e.key]){ e.preventDefault(); mv(...m[e.key]); }
});
let tx,ty;
canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;e.preventDefault();},{passive:false});
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<12&&Math.abs(dy)<12) return;
  Math.abs(dx)>Math.abs(dy)?mv(dx>0?1:-1,0):mv(0,dy>0?1:-1);
  e.preventDefault();
},{passive:false});
window.addEventListener('resize',()=>init());

/* ════════════════════════════════════════════
   ARRANQUE
════════════════════════════════════════════ */
buildLevelBar();
init();
</script>
