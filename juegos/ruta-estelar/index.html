<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<script>
/* La dirección puede llegar sin barra final (/juegos/ruta-estelar): fija la carpeta del juego
   como base para que js/, lib/ y tex/ se busquen en el lugar correcto. */
(function () { var b = document.createElement('base'); b.href = location.pathname.replace(/\/?(index\.html)?$/, '/'); document.head.prepend(b); })();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>Ruta Estelar · Misión Voyager</title>
<meta name="description" content="Juego 3D: el astronauta cruza la Tierra, la Luna y Marte. Gravedad, tiempo, espacio y vitalidad cambian según el planeta.">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05060d;color:#e9edf5;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(4,6,14,.55);overflow:auto;z-index:20}
  #ov[hidden]{display:none}
  @media (min-width:1100px) and (min-height:600px){#ov{justify-content:flex-start;padding-left:5vw;background:linear-gradient(90deg,rgba(4,6,14,.75),rgba(4,6,14,.25) 60%,rgba(4,6,14,0))}}
  .panel{width:min(640px,100%);background:rgba(14,19,36,.94);border:1px solid #27304d;border-radius:14px;padding:22px 22px;max-height:100%;overflow:auto;backdrop-filter:blur(4px)}
  .panel h1{font-size:clamp(30px,6vw,46px);letter-spacing:.12em;font-weight:800;color:#ffc857}
  .panel h2{font-size:22px;color:#ffc857;margin-bottom:6px}
  .panel p{line-height:1.5;color:#b9c2d8;margin:8px 0;font-size:15px}
  .panel .sub{color:#7fb6ff;letter-spacing:.08em;font-size:14px;margin-top:4px}
  .ruta{display:flex;align-items:center;gap:8px;margin:12px 0;flex-wrap:wrap}
  .ruta span{padding:5px 12px;border-radius:99px;border:1px solid #33406a;font-size:13px;color:#8d98b5}
  .ruta span.ok{background:#1c3a2c;border-color:#3fa66b;color:#bff0d2}
  .ruta span.sig{background:#3a2c12;border-color:#ffc857;color:#ffe2a0}
  .ruta i{color:#4a5680;font-style:normal}
  .tienda{display:grid;gap:8px;margin:12px 0}
  .item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:#131a30;border:1px solid #232c48;border-radius:10px;padding:10px 12px}
  .item b{font-size:15px}.item small{color:#8d98b5;font-size:13px;grid-column:1}
  .item .niv{color:#ffc857;letter-spacing:3px;font-size:12px}
  .item button{grid-row:1 / span 2;grid-column:2}
  button{font:inherit;color:#0b0f1c;background:#ffc857;border:0;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer}
  button:disabled{background:#2a3350;color:#6b7694;cursor:default}
  button.gr{width:100%;padding:14px;font-size:17px;margin-top:10px}
  button.sec{background:#1b2440;color:#b9c2d8;border:1px solid #33406a}
  .saldo{display:inline-block;background:#3a2c12;border:1px solid #ffc857;color:#ffe2a0;border-radius:8px;padding:3px 10px;font-weight:700}
  kbd{background:#1b2440;border:1px solid #33406a;border-radius:5px;padding:1px 6px;font-size:13px;color:#e9edf5}
  .volver{display:inline-block;color:#7fb6ff;font-size:13px;text-decoration:none;margin-bottom:6px}
  .historia,.dato{background:#131a30;border-left:3px solid #7fb6ff;border-radius:6px;padding:10px 12px;margin:12px 0;line-height:1.5;color:#c9d1e4;font-size:14px}
  .dato{border-left-color:#ffc857}
  .relato{color:#e9edf5;font-style:italic}
  .vars{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin:12px 0}
  .vars div{background:#131a30;border:1px solid #232c48;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;color:#c9d1e4}
  .vars b{display:block;font-size:12px;letter-spacing:.12em;color:#7fb6ff;margin-bottom:2px}
  .vars em{font-style:normal;color:#ffe2a0;font-weight:700}

  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;font-size:13px}
  #hud[hidden]{display:none}
  #mira{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px}
  #mira:before,#mira:after{content:"";position:absolute;background:rgba(255,255,255,.85);box-shadow:0 0 2px #000}
  #mira:before{left:10px;top:2px;width:2px;height:18px}#mira:after{top:10px;left:2px;height:2px;width:18px}
  #foco{position:absolute;left:50%;top:50%;transform:translate(16px,10px);background:rgba(5,8,18,.7);border:1px solid rgba(127,182,255,.5);border-radius:6px;padding:2px 7px;color:#bfe3ff;white-space:nowrap;font-variant-numeric:tabular-nums}
  #foco:empty{display:none}
  #reglas{position:absolute;left:10px;top:10px;width:250px;background:rgba(5,8,18,.72);border:1px solid #27304d;border-radius:10px;padding:8px 10px;line-height:1.35;pointer-events:auto}
  #reglas .f{display:grid;grid-template-columns:18px 1fr;gap:6px;margin:3px 0}
  #reglas .l{font-weight:800;color:#7fb6ff}
  #reglas small{color:#8d98b5}
  #reglas em{font-style:normal;color:#ffe2a0;font-variant-numeric:tabular-nums}
  .sis{display:grid;grid-template-columns:20px 1fr 34px;align-items:center;gap:5px;margin:3px 0;font-size:12px}
  .sis .bar{height:7px;background:#1b2440;border-radius:9px;overflow:hidden}
  .sis .bar i{display:block;height:100%;border-radius:9px;transition:width .25s}
  .sis span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:#b9c2d8}
  .sis.mal span:last-child{color:#ff6b6b;font-weight:800}
  #arriba{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center}
  #reloj{font-size:20px;font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000}
  #reloj.alerta{color:#ff6b6b}
  #rumbo{margin-top:3px;color:#ffe2a0;text-shadow:0 1px 3px #000}
  #der{position:absolute;top:10px;right:10px;display:flex;gap:6px;align-items:center;pointer-events:auto}
  #der .chip{background:rgba(5,8,18,.72);border:1px solid #27304d;border-radius:8px;padding:5px 9px;font-weight:700}
  #der button{padding:5px 9px;font-size:12px;background:rgba(20,26,48,.85);color:#b9c2d8;border:1px solid #33406a}
  #aviso{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;background:rgba(5,8,18,.75);border:1px solid #ffc857;border-radius:10px;padding:8px 16px;max-width:90vw}
  #aviso b{display:block;color:#ffc857;font-size:17px}#aviso:empty{display:none}
  #barra{position:absolute;left:50%;bottom:16px;width:min(420px,70vw);transform:translateX(-50%);height:8px;background:rgba(27,36,64,.8);border-radius:9px;overflow:hidden}
  #barra i{display:block;height:100%;background:linear-gradient(90deg,#7fb6ff,#ffc857)}
  #barra[hidden]{display:none}
  #dano{position:fixed;inset:0;pointer-events:none;z-index:9;box-shadow:inset 0 0 120px rgba(255,30,40,.0);transition:box-shadow .3s}
  /* táctil */
  #tactil{position:fixed;inset:0;z-index:11;pointer-events:none}
  #tactil[hidden]{display:none}
  #tactil .joy{position:absolute;width:104px;height:104px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);left:30px;bottom:40px;top:auto;opacity:.55}
  #tactil .joy.on{opacity:1}
  #tactil .joy i{position:absolute;left:32px;top:32px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.45)}
  #tactil .bot{position:absolute;right:14px;bottom:22px;display:grid;grid-template-columns:auto auto;gap:10px;pointer-events:auto}
  #tactil button{width:62px;height:62px;border-radius:50%;font-size:13px;background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.4);padding:0}
  #tactil button.s{width:80px;height:80px;background:rgba(255,200,87,.3);border-color:#ffc857;font-size:14px}
  #tactil button.on{background:rgba(127,182,255,.45);border-color:#7fb6ff}
  @media (max-width:560px){
    #arriba{left:auto;right:10px;transform:none;top:50px;text-align:right;max-width:50vw}
    #reloj{font-size:14px!important}#rumbo{font-size:12px}
    #reglas{width:172px!important}
    #aviso{top:30%!important}
  }
  @media (max-width:700px),(max-height:500px){
    #reglas{width:196px;font-size:11px;padding:6px 8px}
    #reglas .det{display:none}
    #reglas.abierto .det{display:inline}
    .sis{grid-template-columns:18px 1fr 28px;font-size:11px}
    #reloj{font-size:16px}
    #der .chip,#der button{padding:4px 7px}
    #aviso{top:14%;font-size:12px}#aviso b{font-size:14px}
    #tactil .joy{bottom:24px;left:22px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dano"></div>
<div id="hud" hidden>
  <div id="reglas"></div>
  <div id="arriba"><div id="reloj"></div><div id="rumbo"></div></div>
  <div id="der"><span class="chip" id="monedas">🪙 0</span><button id="bcam" title="Cámara (C)">👁</button><button id="son">🔊</button><button id="bpausa">⏸</button></div>
  <div id="mira"></div><div id="foco"></div>
  <div id="aviso"></div>
  <div id="barra" hidden><i></i></div>
</div>
<div id="tactil" hidden>
  <div class="joy"><i></i></div>
  <div class="bot">
    <button data-a="usar" aria-label="Tomar">✋</button><button data-a="camara" aria-label="Cámara">👁</button>
    <button data-a="correr" aria-label="Correr">CORRER</button><button class="s" data-a="saltar" aria-label="Saltar">SALTAR</button>
  </div>
</div>
<div id="ov"><div class="panel" id="panel"><p>Cargando…</p></div></div>
<noscript><p style="padding:20px">Este juego necesita JavaScript.</p></noscript>
<script>
/* Si el juego no arranca, mostrar por qué (en vez de quedarse en «Cargando…»). */
(function () {
  var errores = [];
  function mostrarError(txt) {
    if (window.__rs) return;
    var p = document.getElementById('panel');
    p.innerHTML = '<h2>El juego no pudo arrancar</h2><p>' + txt + '</p>' +
      (errores.length ? '<p><small>Detalle técnico: ' + errores.slice(0, 3).join(' · ').replace(/</g, '&lt;') + '</small></p>' : '') +
      '<p><small>Navegador: ' + navigator.userAgent.replace(/</g, '&lt;') + '</small></p>' +
      '<button class="gr" onclick="location.reload()">Reintentar</button>';
  }
  addEventListener('error', function (e) { errores.push((e.message || 'error al cargar ' + (e.target && e.target.src || '')) + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); }, true);
  addEventListener('unhandledrejection', function (e) { errores.push(String(e.reason && e.reason.message || e.reason)); });
  // WebGL 2 es obligatorio para el motor 3D
  try {
    var gl = document.createElement('canvas').getContext('webgl2');
    if (!gl) { window.__sinWebGL2 = true; }
  } catch (e) { window.__sinWebGL2 = true; }
  if (window.__sinWebGL2) {
    setTimeout(function () { mostrarError('Este navegador o equipo no tiene <b>WebGL 2</b>, que el juego 3D necesita. Prueba con Chrome, Edge o Firefox actualizados, o activa la aceleración por hardware en la configuración del navegador.'); }, 0);
    return;
  }
  var t0 = Date.now();
  var reloj = setInterval(function () {
    if (window.__rs) return clearInterval(reloj);
    var s = Math.round((Date.now() - t0) / 1000);
    if (errores.length) { clearInterval(reloj); mostrarError('Hubo un error al cargar el juego.'); }
    else if (s >= 25) { clearInterval(reloj); mostrarError('La carga está tardando demasiado. Revisa la conexión e intenta de nuevo.'); }
    else document.getElementById('panel').innerHTML = '<p>Cargando el motor 3D… ' + s + ' s</p>';
  }, 1000);
})();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
