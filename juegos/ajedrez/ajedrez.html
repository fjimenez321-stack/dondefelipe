<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1226">
<title>Ajedrez Agustino · El Mundo de Felipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --noche:#0d1226; --piedra:#262b42; --piedra-2:#333a58; --muro:#1b2036;
  --azul:#2f4a8c; --azul-2:#4466b3; --oro:#e8b43a; --oro-2:#ffd66b; --marfil:#f3e7c9; --tinta:#1a1208;
  --rojo:#c8323c; --verde:#3f8a4a; --gris:#9aa3c0;
  --px:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;font-family:'Pixelify Sans',system-ui,monospace;color:var(--marfil);background-color:var(--noche);
  /* muro de piedra del claustro */
  background-image:
    linear-gradient(180deg,rgba(13,18,38,.15),rgba(13,18,38,.85) 70%),
    linear-gradient(var(--muro) 2px,transparent 2px),
    linear-gradient(90deg,var(--muro) 2px,transparent 2px),
    linear-gradient(90deg,var(--muro) 2px,transparent 2px);
  background-size:100% 100%,48px 24px,48px 48px,48px 48px;
  background-position:0 0,0 0,0 0,24px 24px;
  -webkit-font-smoothing:none;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--oro-2);outline-offset:2px}
a{color:var(--oro-2)}

/* ── encabezado ── */
header{max-width:1100px;margin:0 auto;padding:12px 16px 6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.volver{font-size:.95rem;text-decoration:none;color:var(--gris)}
.volver:hover{color:var(--oro-2)}
.titulo{display:flex;align-items:center;gap:10px;flex:1;min-width:220px}
.titulo img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(232,180,58,.45))}
.titulo h1{font-size:clamp(1.4rem,4.5vw,2rem);font-weight:700;color:var(--oro);letter-spacing:1px;line-height:1;
  text-shadow:3px 3px 0 #000,0 0 14px rgba(232,180,58,.25)}
.titulo small{display:block;font-size:.8rem;color:var(--gris);font-weight:400;letter-spacing:.5px;margin-top:4px;text-shadow:none}
.cuenta{font-size:.9rem;display:flex;gap:8px;align-items:center}
.cuenta:empty{display:none}
.cuenta button{background:none;border:0;color:var(--oro-2);text-decoration:underline}

/* ── botones pixel ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;min-height:44px;border:0;
  background:var(--azul);color:var(--marfil);font-weight:600;font-size:1rem;letter-spacing:.3px;
  box-shadow:0 0 0 3px #05070f,inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.18);text-shadow:2px 2px 0 rgba(0,0,0,.45)}
.btn:hover{background:var(--azul-2)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 3px #05070f,inset 4px 4px 0 rgba(0,0,0,.35)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.oro{background:var(--oro);color:var(--tinta);text-shadow:none}
.btn.oro:hover{background:var(--oro-2)}
.btn.rojo{background:var(--rojo)}
.btn.verde{background:var(--verde)}
.btn.sec{background:var(--piedra-2)}
.btn.chico{min-height:36px;padding:6px 10px;font-size:.9rem}
.btn.grande{width:100%;min-height:52px;font-size:1.1rem;justify-content:flex-start;padding-left:16px}

/* ── juego ── */
main{max-width:1100px;margin:0 auto;padding:8px 16px 28px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start;position:relative;z-index:1}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr);gap:14px}}
.col-tablero{display:grid;gap:8px;min-width:0}
.barra{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--piedra);min-height:52px;
  box-shadow:0 0 0 3px #05070f,inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.06)}
.barra.turno{box-shadow:0 0 0 3px #05070f,0 0 0 6px var(--oro),inset -3px -3px 0 rgba(0,0,0,.3)}
.barra .av{width:36px;height:36px;object-fit:contain;flex:none}
.barra .nom{font-weight:600;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.barra .caps{display:flex;flex-wrap:wrap;align-items:center;gap:0;flex:1;min-width:0;font-size:.85rem;color:var(--gris)}
.barra .caps img{width:22px;height:22px;margin-right:-7px}
.barra .caps b{margin-left:10px;font-weight:600;color:var(--oro-2)}
.reloj{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 10px;min-width:96px;text-align:center;
  background:#05070f;color:var(--gris);letter-spacing:1px}
.reloj.activo{background:var(--marfil);color:var(--tinta)}
.reloj.poco{background:var(--rojo);color:#fff}
.reloj:empty{display:none}
.marco{position:relative;display:flex;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
#tablero{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;
  box-shadow:0 0 0 3px #05070f,10px 10px 0 rgba(0,0,0,.45)}

.panel{display:grid;gap:12px;min-width:0}
.caja{background:var(--piedra);padding:12px;box-shadow:0 0 0 3px #05070f,inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.06)}
.caja h2{font-size:.85rem;font-weight:600;color:var(--oro);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
#estado{font-size:1.15rem;font-weight:600;line-height:1.25}
#estado small{display:block;font-size:.85rem;color:var(--gris);font-weight:400;margin-top:4px}
.nav-jug{display:flex;gap:6px;margin-bottom:8px}
.nav-jug .btn{flex:1;min-height:34px;padding:4px}
#jugadas{list-style:none;max-height:260px;overflow:auto;display:grid;grid-template-columns:34px 1fr 1fr;font-size:1rem;background:#141829;padding:4px}
@media (max-width:820px){#jugadas{max-height:150px}}
#jugadas .n{color:var(--gris);padding:3px 4px;text-align:right}
#jugadas button{background:none;border:0;text-align:left;padding:3px 6px;color:var(--marfil)}
#jugadas button:hover{background:var(--piedra-2)}
#jugadas button.ver{background:var(--oro);color:var(--tinta)}
#jugadas .vacio{grid-column:1/-1;color:var(--gris);padding:6px;font-size:.9rem}
.acciones{display:flex;flex-wrap:wrap;gap:8px}
.acciones .btn{flex:1 1 auto}
.aviso{padding:10px;background:#141829;font-size:.95rem;line-height:1.35;margin-top:8px}
.aviso.oro{background:rgba(232,180,58,.15);box-shadow:inset 0 0 0 2px var(--oro)}
.aviso.err{background:rgba(200,50,60,.18);box-shadow:inset 0 0 0 2px var(--rojo)}
.aviso .acciones{margin-top:8px}
.codigo{font-size:2.4rem;font-weight:700;letter-spacing:8px;color:var(--oro-2);text-align:center;background:#05070f;padding:8px;margin:8px 0;text-shadow:3px 3px 0 #000}

/* ── ventanas ── */
#velo{position:fixed;inset:0;background:rgba(5,7,15,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#velo.abierto{display:flex}
.ventana{width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--piedra);padding:18px;
  box-shadow:0 0 0 3px #05070f,0 0 0 7px var(--oro),0 0 0 10px #05070f,12px 12px 0 10px rgba(0,0,0,.5)}
.ventana h3{font-size:1.4rem;color:var(--oro);text-shadow:2px 2px 0 #000;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.ventana h3 img{width:40px;height:40px;object-fit:contain}
.ventana .sub{color:var(--gris);font-size:.9rem;margin-bottom:14px}
.ventana p{line-height:1.4;margin-bottom:10px}
.ventana .lista{display:grid;gap:12px;margin-top:6px}
.pie{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.etq{display:block;font-size:.8rem;color:var(--oro);letter-spacing:1.5px;text-transform:uppercase;margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;padding:8px 12px;background:#141829;box-shadow:0 0 0 2px #05070f;cursor:pointer;font-weight:600}
.chips span small{display:block;font-size:.72rem;color:var(--gris);font-weight:400}
.chips input:checked+span{background:var(--oro);color:var(--tinta)}
.chips input:checked+span small{color:var(--tinta)}
.chips input:focus-visible+span{outline:3px solid var(--oro-2)}
.campo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.campo input{width:80px;padding:8px;background:#05070f;border:0;box-shadow:0 0 0 2px var(--azul-2);font-size:1.05rem}
input.codigo-in{width:100%;font-size:2rem;letter-spacing:8px;text-align:center;text-transform:uppercase;padding:10px;background:#05070f;border:0;box-shadow:0 0 0 3px var(--azul-2);color:var(--oro-2)}
.coronar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.coronar button{background:#d9c49a;border:0;padding:6px;box-shadow:0 0 0 3px #05070f}
.coronar button:hover{background:var(--oro-2)}
.coronar img{width:100%;display:block}
.regla{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;margin-bottom:10px}
.regla img{width:44px;height:44px;background:#d9c49a;box-shadow:0 0 0 2px #05070f}
.regla p{margin:0;font-size:.95rem}
.partida-it{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#141829;padding:8px 10px}
.partida-it small{color:var(--gris);display:block}
.fin-ico{display:flex;justify-content:center;gap:10px;margin:6px 0 12px}
.fin-ico img{width:72px;height:72px}
.notas{font-size:.85rem;color:var(--gris);line-height:1.35;margin-top:8px}
.gatos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;max-height:260px;overflow:auto;padding:2px}
.gatos label{position:relative;cursor:pointer}
.gatos input{position:absolute;opacity:0;pointer-events:none}
.gatos span{display:grid;justify-items:center;gap:2px;padding:6px 4px;background:#141829;box-shadow:0 0 0 2px #05070f;font-size:.78rem;text-align:center;line-height:1.1}
.gatos img{width:56px;height:56px;object-fit:contain}
.gatos small{font-size:.66rem}
.gatos input:checked+span{background:var(--oro);color:var(--tinta)}
.gatos input:disabled+span{opacity:.35;cursor:not-allowed}
.apuesta-vs{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0;text-align:center;font-size:.85rem}
.apuesta-vs img{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto}
.apuesta-vs b{font-size:1.3rem;color:var(--oro)}
.agustin{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start;margin-top:10px}
.agustin img{width:48px;height:48px;object-fit:cover;background:#d9c49a;box-shadow:0 0 0 2px #05070f}
.agustin .globo{background:var(--marfil);color:var(--tinta);padding:8px 10px;font-size:.95rem;line-height:1.3;position:relative;box-shadow:0 0 0 2px #05070f}
.agustin .globo:before{content:"";position:absolute;left:-8px;top:12px;border:4px solid transparent;border-right-color:var(--marfil);border-width:5px 8px 5px 0}
.agustin .globo b{display:block;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;color:#7a1f24;margin-bottom:2px}
.agustin .globo small{display:block;margin-top:5px;font-size:.78rem;color:#5a4a33;font-style:italic}
.agustin.nuevo .globo{animation:globo .35s ease-out}
@keyframes globo{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.barra-prog{height:12px;background:#05070f;box-shadow:0 0 0 2px #05070f;margin:8px 0}
.barra-prog i{display:block;height:100%;background:var(--oro);width:0;transition:width .2s}
.precision{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.precision div{background:#141829;padding:6px 8px;text-align:center;font-size:.85rem}
.precision b{display:block;font-size:1.5rem;color:var(--oro-2)}
.cuentas-an{font-size:.8rem;color:var(--gris);line-height:1.5}
#grafico{width:100%;height:70px;image-rendering:pixelated;display:block;margin:6px 0;cursor:pointer}
.an-lista{list-style:none;max-height:220px;overflow:auto;display:grid;grid-template-columns:34px 1fr 1fr;background:#141829;padding:4px;font-size:.95rem}
.an-lista .n{color:var(--gris);padding:3px 4px;text-align:right}
.an-lista button{background:none;border:0;text-align:left;padding:3px 6px;color:var(--marfil)}
.an-lista button.ver{outline:2px solid var(--oro)}
.cat-mejor,.cat-excelente{color:#7fe08a}.cat-buena{color:var(--marfil)}.cat-imprecision{color:#f2d06b}.cat-error{color:#ff9a4d}.cat-grave{color:#ff5a5a}
.an-detalle{background:#141829;padding:8px 10px;margin-top:8px;font-size:.92rem;line-height:1.35}
.an-detalle .tit{font-weight:700;margin-bottom:4px}
#jugadas .sim{font-size:.75rem;margin-left:3px}
footer{text-align:center;color:var(--gris);font-size:.8rem;padding:0 16px 24px}
</style>
</head>
<body>
<header>
  <a class="volver" href="../../index.html">← El Mundo de Felipe</a>
  <div class="titulo"><img id="logo" alt=""><div><h1>Ajedrez Agustino</h1><small>Claustro de San Agustín · 2 jugadores</small></div></div>
  <div class="cuenta" id="cuenta"></div>
</header>

<main>
  <section class="col-tablero">
    <div class="barra" id="barra-arriba"></div>
    <div class="marco" id="marco"><canvas id="tablero" width="144" height="144" aria-label="Tablero de ajedrez"></canvas></div>
    <div class="barra" id="barra-abajo"></div>
  </section>
  <aside class="panel">
    <div class="caja"><div id="estado">Cargando…</div><div id="avisos"></div><div id="agustin"></div></div>
    <div class="caja" id="analisis" hidden></div>
    <div class="caja">
      <h2>Jugadas</h2>
      <div class="nav-jug">
        <button class="btn sec" id="v-ini" title="Al inicio" aria-label="Al inicio">⏮</button>
        <button class="btn sec" id="v-ant" title="Jugada anterior" aria-label="Jugada anterior">◀</button>
        <button class="btn sec" id="v-sig" title="Jugada siguiente" aria-label="Jugada siguiente">▶</button>
        <button class="btn sec" id="v-fin" title="Posición actual" aria-label="Posición actual">⏭</button>
      </div>
      <ol id="jugadas"></ol>
    </div>
    <div class="caja"><div class="acciones" id="acciones"></div></div>
    <div class="caja" id="sala-info" hidden></div>
  </aside>
</main>
<footer>Toca una pieza y luego su casilla de destino, o arrástrala. El Mundo de Felipe · Colegio San Agustín de Villa Alemana</footer>

<div id="velo"><div class="ventana" id="ventana" role="dialog" aria-modal="true"></div></div>

<script src="motor.js"></script>
<script src="pixel.js"></script>
<script src="agustin.js"></script>
<script src="../../gatitos/catalogo.js"></script>
<script src="../../firebase/df.js?v=20261104e" data-sin-aviso></script>
<script>
(function(){
'use strict';
const A=window.Ajedrez, P=window.Pixel;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLECCION='ajedrez_salas', ALFA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const NOMBRE_COLOR={w:'Blancas',b:'Negras'};
const RITMOS=[
  {id:'0',base:0,inc:0,t:'Sin reloj',s:'tranquilo'},
  {id:'1+0',base:1,inc:0,t:'1 min',s:'bala'},
  {id:'3+2',base:3,inc:2,t:'3 + 2',s:'relámpago'},
  {id:'5+0',base:5,inc:0,t:'5 min',s:'relámpago'},
  {id:'10+0',base:10,inc:0,t:'10 min',s:'rápido'},
  {id:'15+10',base:15,inc:10,t:'15 + 10',s:'rápido'},
  {id:'30+0',base:30,inc:0,t:'30 min',s:'clásico'},
  {id:'otro',base:-1,inc:0,t:'Otro',s:'a tu gusto'}
];

/* ═════════════ estado general ═════════════ */
let MODO='local';            // 'local' | 'linea'
let E=A.nuevo();             // posición actual (con historial)
let VISTA=null;              // número de jugada que se está revisando (null = en vivo)
let ORIENT='w';              // color que se ve abajo
let SEL=-1, ARR=null, ANIM=null;
let FIN=null;                // resultado cuando termina
let RELOJ=null;              // local: {base,inc,w,b,desde,corriendo}
let GIRAR_AUTO=false;
let SONIDO=true;
try{SONIDO=localStorage.getItem('ajedrez_sonido')!=='0';GIRAR_AUTO=localStorage.getItem('ajedrez_girar')==='1';}catch(e){}

// en línea
let ONLINE=false, USR=null, SALA=null, salaRef=null, salaUnsub=null, MI_COLOR='', ENVIANDO=false, RECLAMANDO=0, FIN_MOSTRADO='';
let DESF=0;                  // hora del servidor − hora de este equipo (ms)
// contra la máquina
let MAQ=null, PENSANDO=false, WORKER=null, PEDIDO=0;
// apuestas y ranking (en línea)
let PROCESANDO=false, INVALIDA='', AVISO_COBRO='', REINTENTO=null, CERRANDO=false;
const MOTIVOS_TABLERO=['jaque-mate','ahogado','material','repeticion','50-jugadas'];
// San Agustín y el análisis
let COMENTARIOS=true, COMENTARIO=null, AVISO_TIEMPO={}, ANALISIS=null, ANAL_SEL=null, ANALIZANDO=false;
try{COMENTARIOS=localStorage.getItem('ajedrez_agustin')!=='0';}catch(e){}
const NIVELES={facil:'Fácil',medio:'Medio',dificil:'Difícil',maestro:'Maestro'};

/* ═════════════ hora del servidor ═════════════ */
function srvAhora(){return Date.now()+DESF;}
(function medirReloj(){
  const t0=Date.now();
  fetch(location.href.split('#')[0],{method:'HEAD',cache:'no-store'}).then(r=>{
    const d=Date.parse(r.headers.get('date')||'');if(isNaN(d))return;
    const t1=Date.now();DESF=d+500-(t0+t1)/2;
  }).catch(()=>{});
})();

/* ═════════════ sonido (sin archivos) ═════════════ */
let AC=null;
function tono(f,dur,tipo,vol,desde){
  if(!SONIDO)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+(desde||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=tipo||'square';o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);
  }catch(e){}
}
const SND={
  mover:()=>{tono(196,.07,'triangle',.22);tono(98,.06,'square',.03);},
  captura:()=>{tono(146,.09,'square',.07);tono(98,.12,'triangle',.25,.05);},
  jaque:()=>{tono(659,.09,'square',.05);tono(880,.14,'square',.05,.09);},
  fin:()=>{[523,659,784,1046].forEach((f,i)=>tono(f,.18,'square',.05,i*.13));},
  error:()=>tono(110,.15,'sawtooth',.04)
};
/* ═════════════ banda sonora ═════════════
   Dos temas que se alternan sin parar. Parten con el primer toque (los navegadores no dejan sonar
   nada antes), se pausan si la pestaña queda oculta y el botón 🎵 los apaga (se recuerda). */
const MUSICA=[{src:'musica/notas-del-claustro.mp3',titulo:'Notas del claustro'},{src:'musica/oraciones-arco-de-piedra.mp3',titulo:'Oraciones en el arco de piedra'}];
let MUSICA_ON=true, PISTA_M=Math.floor(Math.random()*MUSICA.length), AUDIO=null, MUSICA_LISTA=false;
try{MUSICA_ON=localStorage.getItem('ajedrez_musica')!=='0';}catch(e){}
function musica(){
  if(!MUSICA_ON||!MUSICA_LISTA||document.hidden){if(AUDIO)AUDIO.pause();return;}
  if(!AUDIO){
    AUDIO=new Audio();AUDIO.preload='auto';AUDIO.volume=0;
    AUDIO.addEventListener('ended',()=>{PISTA_M=(PISTA_M+1)%MUSICA.length;AUDIO.src=MUSICA[PISTA_M].src;AUDIO.play().catch(()=>{});pintarAcciones();});
    AUDIO.addEventListener('error',()=>{PISTA_M=(PISTA_M+1)%MUSICA.length;});
    AUDIO.src=MUSICA[PISTA_M].src;
  }
  AUDIO.play().then(()=>{
    // entrada suave
    const meta=.32;clearInterval(AUDIO._f);AUDIO._f=setInterval(()=>{AUDIO.volume=Math.min(meta,AUDIO.volume+.02);if(AUDIO.volume>=meta)clearInterval(AUDIO._f);},80);

/* ═════════════ tablero en canvas ═════════════ */
const B=8, CS=16, TAM=B*2+CS*8;   // 144 píxeles lógicos (tablero de pixel art de respaldo)

// Tableros ilustrados (sprites/tablero-azul.webp y tablero-rojo.webp; «-negras» trae las letras y números al revés).
// Medidas en la imagen: 1254 × 1290 px, casillas de 118 px desde (155, 159,4).
const TAB={w:1254,h:1290,x0:155,y0:159.39,cas:118};
let GX=B, GY=B, GW=TAM, GH=TAM;   // dónde empieza el tablero y tamaño del lienzo, en unidades (CS = una casilla)
const IMG_TAB={}, ESC_TAB={};
function imgTablero(color,orient){

}
let usaIlustrado=false;
function geometria(){
  if(usaIlustrado){const s=CS/TAB.cas;GX=TAB.x0*s;GY=TAB.y0*s;GW=TAB.w*s;GH=TAB.h*s;}
  else{GX=GY=B;GW=GH=TAM;}
}
// ¿Algún jugador perdió la dama? Entonces el tablero se pone rojo.
function sinDama(e){return A.capturadas(e).w.concat(A.capturadas(e).b).some(p=>p==='Q'||p==='q');}
function fondoIlustrado(e){
  let color=sinDama(e)?'rojo':'azul', orient=ORIENT, im=imgTablero(color,orient);
  // mientras carga la que corresponde, se usa la más parecida que ya esté
  if(!im){const o=orient==='w'?'b':'w';im=IMG_TAB[color+(o==='b'?'-negras':'')]&&imgTablero(color,o);if(im)orient=o;}
  if(!im&&color==='rojo'){im=imgTablero('azul',orient);color='azul';}
  if(!im)return null;
  const k=color+orient+'@'+K;
  if(ESC_TAB[k])return ESC_TAB[k];

  let src=im,w=im.naturalWidth,h=im.naturalHeight;const W=Math.round(GW*K),H=Math.round(GH*K);
  while(w/2>W*1.2){const t=document.createElement('canvas');t.width=Math.round(w/2);t.height=Math.round(h/2);const g=t.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(src,0,0,t.width,t.height);src=t;w=t.width;h=t.height;}
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(src,0,0,W,H);

function hash(a,b,c,d){let h=(a*73856093)^(b*19349663)^(c*83492791)^(d*2654435761);h=(h^(h>>>13))*1274126177;return ((h^(h>>>16))>>>0)%97;}
function fondo(orient){
  if(FONDO[orient])return FONDO[orient];
  const f=document.createElement('canvas');f.width=f.height=TAM;const x=f.getContext('2d');
  // marco: contorno, oro, banda azul, línea oscura
  x.fillStyle='#05070f';x.fillRect(0,0,TAM,TAM);
  x.fillStyle='#d9a62a';x.fillRect(1,1,TAM-2,TAM-2);
  x.fillStyle='#24386c';x.fillRect(2,2,TAM-4,TAM-4);
  for(let i=4;i<TAM-4;i+=8){x.fillStyle='#2f4a8c';x.fillRect(i,2,4,1);x.fillRect(i,TAM-3,4,1);x.fillRect(2,i,1,4);x.fillRect(TAM-3,i,1,4);}
  x.fillStyle='#05070f';x.fillRect(B-1,B-1,CS*8+2,CS*8+2);
  [[1,1],[TAM-7,1],[1,TAM-7],[TAM-7,TAM-7]].forEach(([a,b])=>{x.fillStyle='#d9a62a';x.fillRect(a,b,6,6);x.fillStyle='#ffd66b';x.fillRect(a+1,b+1,2,2);x.fillStyle='#8a5f12';x.fillRect(a+3,b+3,2,2);});
  // casillas de piedra con textura
  for(let f8=0;f8<8;f8++)for(let c8=0;c8<8;c8++){
    const clara=(f8+c8)%2===1;
    const sx=B+(orient==='w'?c8:7-c8)*CS, sy=B+(orient==='w'?7-f8:f8)*CS;
    x.fillStyle=clara?'#dcc79b':'#8b6845';x.fillRect(sx,sy,CS,CS);
    for(let py=0;py<CS;py++)for(let px=0;px<CS;px++){
      const h=hash(f8,c8,px,py);
      if(h<6){x.fillStyle=clara?'#cbb383':'#7a5a39';x.fillRect(sx+px,sy+py,1,1);}
      else if(h<9){x.fillStyle=clara?'#ead9b3':'#9c7854';x.fillRect(sx+px,sy+py,1,1);}
    }
    x.fillStyle=clara?'rgba(255,255,255,.18)':'rgba(255,255,255,.08)';x.fillRect(sx,sy,CS,1);x.fillRect(sx,sy,1,CS);
    x.fillStyle='rgba(0,0,0,.12)';x.fillRect(sx,sy+CS-1,CS,1);x.fillRect(sx+CS-1,sy,1,CS);
  }
  // coordenadas
  for(let i=0;i<8;i++){
    const col='abcdefgh'[orient==='w'?i:7-i], fil=String(orient==='w'?8-i:i+1);
    P.letra(x,col,B+i*CS+6,TAM-B+2,'#ffd66b');

}
function xy(sq){const f=sq>>3,c=sq&7;return [GX+(ORIENT==='w'?c:7-c)*CS, GY+(ORIENT==='w'?7-f:f)*CS];}
function casillaEn(ev){
  const r=cv.getBoundingClientRect();

  if(x<0||y<0||x>=CS*8||y>=CS*8)return -1;

function ajustar(){
  const alto=window.innerHeight-210>300?window.innerHeight-210:640;
  const ancho=Math.min($('marco').clientWidth, 680, alto*GW/GH);
  const dpr=window.devicePixelRatio||1, lado=Math.floor(ancho);
  // se dibuja con un tamaño entero de píxel por unidad y el navegador lo ajusta al ancho disponible
  K=Math.max(4,Math.ceil(lado*dpr/GW));
  cv.width=Math.round(GW*K);cv.height=Math.round(GH*K);
  cv.style.width=lado+'px';cv.style.height=Math.round(lado*GH/GW)+'px';
  cv.style.imageRendering=Math.round(GW*K)===lado*dpr?'pixelated':'auto';

function posicionVista(){
  if(VISTA==null)return E;
  let e=E;while(e.historial.length>VISTA&&e.anterior)e=e.anterior;return e;
}
function dibujar(){
  const e=posicionVista();
  ctx.setTransform(K,0,0,K,0,0);ctx.imageSmoothingEnabled=false;
  const ilus=usaIlustrado&&fondoIlustrado(e);
  if(ilus)ctx.drawImage(ilus,0,0,GW,GH);
  else{ctx.clearRect(0,0,GW,GH);ctx.drawImage(fondo(ORIENT),GX-B,GY-B);}
  const ult=e.historial[e.historial.length-1];
  const tinte=(sq,col)=>{const [x,y]=xy(sq);ctx.fillStyle=col;ctx.fillRect(x,y,CS,CS);};
  if(ult){tinte(ult.de,'rgba(232,180,58,.42)');tinte(ult.a,'rgba(232,180,58,.42)');}
  if(VISTA==null&&A.enJaque(e)){
    const r=e.t.indexOf(e.turno==='w'?'K':'k');const [x,y]=xy(r);

    const [x,y]=xy(SEL);ctx.fillStyle='rgba(120,190,255,.45)';ctx.fillRect(x,y,CS,CS);

  }

    const p=e.t[i];if(!p)continue;

    if(ANIM&&i===ANIM.a)continue;
    const [x,y]=xy(i);
    ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(x+3,y+14,10,1);
    P.dibujarPieza(ctx,p,x,y,CS,K);
  }
  // destinos posibles

    if(vistos[m.a])return;vistos[m.a]=1;

    if(m.captura){ctx.fillStyle='rgba(15,20,45,.55)';[[0,0],[CS-3,0],[0,CS-3],[CS-3,CS-3]].forEach(([a,b])=>{ctx.fillRect(x+a,y+b,3,1);ctx.fillRect(x+a+(a?2:0),y+b,1,3);ctx.fillRect(x+a,y+b+(b?2:0),3,1);});}

  });

/* ═════════════ quién puede mover ═════════════ */
function puedoMover(color){
  if(VISTA!=null||FIN)return false;
  if(color!==E.turno)return false;
  if(MODO==='local')return true;
  if(MODO==='maquina')return !!MAQ&&color===MAQ.color&&!PENSANDO;
  return !!(SALA&&SALA.estado==='jugando'&&MI_COLOR===color&&!ENVIANDO);

/* ═════════════ toques y arrastre ═════════════ */
function aLogico(ev){const r=cv.getBoundingClientRect();return [(ev.clientX-r.left)/r.width*GW,(ev.clientY-r.top)/r.height*GH];}

  if(ev.button>0)return;

  const sq=casillaEn(ev);if(sq<0)return;
  const p=E.t[sq];
  if(SEL>=0&&SEL!==sq&&A.legales(E,SEL).some(m=>m.a===sq)){intentar(SEL,sq);return;}
  if(p&&A.colorDe(p)===E.turno&&puedoMover(E.turno)){
    const ya=SEL===sq;SEL=sq;
    const [x,y]=aLogico(ev);ARR={sq,x,y,x0:x,y0:y,movido:false,ya};

function soltar(ev,cancelar){

  }else if(!a.movido&&a.ya){SEL=-1;}

cv.addEventListener('pointerup',ev=>soltar(ev));

    ${MODO==='linea'?textoApuestaFin(r):''}${notaRanking(r)}${MODO==='maquina'&&r.ganador===MAQ.color?'<p style="text-align:center">🎉 ¡Le ganaste a la máquina!</p>':''}
    <div class="pie">${analizar}${botones}</div>`);
  cerrar();
  if(res==='analizar')return analizarPartida();
  if(res==='menu')return menu();
  if(res==='otra')return MODO==='maquina'?nuevaMaquina(MAQ):nuevaLocal(RELOJ?{base:RELOJ.base,inc:RELOJ.inc}:{base:0,inc:0});
  if(res==='revancha')return proponerRevancha();
}

let resolverVentana=null;
function ventana(html,opc){
  $('ventana').innerHTML=html;$('velo').classList.add('abierto');
  const p=new Promise(r=>{resolverVentana=r;});
  $('ventana').onclick=ev=>{const b=ev.target.closest('[data-r]');if(b&&resolverVentana){const r=resolverVentana;resolverVentana=null;r(b.dataset.r);}};
  $('velo').onclick=ev=>{if(ev.target===$('velo')&&opc&&opc.cerrable&&resolverVentana){const r=resolverVentana;resolverVentana=null;r('');}};
  setTimeout(()=>{const f=$('ventana').querySelector('input,button');if(f)f.focus();},30);
  return p;
}
function cerrar(){$('velo').classList.remove('abierto');$('ventana').innerHTML='';resolverVentana=null;}

async function elegirRitmo(enLinea){
  let pref='10+0';try{pref=localStorage.getItem('ajedrez_ritmo')||pref;}catch(e){}

    <div class="campo" id="otro-ritmo" hidden><label>Minutos <input type="number" id="r-min" min="1" max="180" value="20"></label><label>+ segundos por jugada <input type="number" id="r-inc" min="0" max="60" value="5"></label></div>
    ${enLinea?`<span class="etq">Tu color</span>
    <div class="chips">
      <label><input type="radio" name="color" value="w" checked><span>Blancas</span></label>
      <label><input type="radio" name="color" value="b"><span>Negras</span></label>
      <label><input type="radio" name="color" value="azar"><span>Al azar</span></label>
    </div>`:''}
    <div class="pie"><button class="btn sec" data-r="volver">Volver</button><button class="btn oro" data-r="ok">${enLinea?'Crear sala':'¡A jugar!'}</button></div>`);
  const id=(document.querySelector('input[name=ritmo]:checked')||{}).value||'0';
  const col=(document.querySelector('input[name=color]:checked')||{}).value||'w';
  const min=Math.min(180,Math.max(1,+($('r-min')||{}).value||20)),inc=Math.min(60,Math.max(0,+($('r-inc')||{}).value||0));

function nuevaLocal(t){
  PEDIDO++;PENSANDO=false;PISTA=null;
  MODO='local';E=A.nuevo();VISTA=null;SEL=-1;FIN=null;ORIENT='w';
  RELOJ=t&&t.base?{base:t.base,inc:t.inc,w:t.base,b:t.base,desde:0,corriendo:false}:null;
  reiniciarExtras();decir(Agustin.frase('inicio'));
  guardarLocal();pintarTodo();
}
function guardarLocal(){
  if(MODO!=='local')return;
  try{localStorage.setItem('ajedrez_local',JSON.stringify({jugadas:E.historial.map(h=>h.uci),reloj:RELOJ&&{base:RELOJ.base,inc:RELOJ.inc,w:restante('w'),b:restante('b')},fin:FIN}));}catch(e){}
}
function continuarLocal(g){
  salirDeSala();PEDIDO++;PENSANDO=false;
  MODO='local';VISTA=null;SEL=-1;FIN=null;
  try{E=A.partida(g.jugadas);}catch(e){E=A.nuevo();}
  reiniciarExtras();
  RELOJ=g.reloj&&g.reloj.base?{base:g.reloj.base,inc:g.reloj.inc,w:g.reloj.w,b:g.reloj.b,desde:0,corriendo:false}:null;
  ORIENT=GIRAR_AUTO?E.turno:'w';
  pintarTodo();
}

async function crearSala(de,colorForzado,tiempoForzado){
  try{await exigirCuenta();}catch(e){return menu();}

    try{

        }else if(ap.tipo==='gatito'){

        }

          blancas:t.color==='w'?yo:null,negras:t.color==='b'?yo:null,jugadores:[USR.uid],
          tiempo:{base:t.base,inc:t.inc},reloj:{w:t.base,b:t.base},jugadas:[],fen:A.INICIAL,turno:'w',
          turnoDesde:F.serverTimestamp(),seq:0,tablas:'',resultado:null,revancha:'',revanchaDe:'',de:de||'',
          creado:F.serverTimestamp(),actualizado:F.serverTimestamp(),

async function pedirCodigo(msg){

async function unirse(codigo){
  try{await exigirCuenta();}catch(e){return menu();}
  const {db,F}=await DF.listo(),ref=F.doc(db,COLECCION,codigo);
  let s;
  try{s=await F.getDoc(ref);}catch(e){const c=await pedirCodigo('No se pudo leer la sala: '+(e.message||e));return c?unirse(c):menu();}
  if(!s.exists()){const c=await pedirCodigo(`No existe la sala ${codigo}.`);return c?unirse(c):menu();}
  const d=s.data();
  if(d.estado==='espera'&&!(d.jugadores||[]).includes(USR.uid)){
    let pago=null;
    if(d.apuesta){
      pago=await aceptarApuesta(d);
      if(pago==='mirar'){escuchar(codigo);return;}
      if(!pago)return menu();
    }
    try{
      await F.runTransaction(db,async tx=>{
        const x=(await tx.get(ref)).data();
        if(x.estado!=='espera')throw new Error('Alguien más entró primero.');
        const yo={uid:USR.uid,nombre:miNombre()}, col=x.blancas?'b':'w';
        const upd={jugadores:[...x.jugadores,USR.uid],estado:'jugando',turnoDesde:F.serverTimestamp(),seq:x.seq+1,actualizado:F.serverTimestamp()};
        if(col==='w')upd.blancas=yo;else upd.negras=yo;
        if(x.apuesta){
          const ap={...x.apuesta};
          if(x.apuesta.tipo==='hipopesos'){
            const cu=await leerCuentaTx(tx);
            if((cu.saldo||0)<x.apuesta.monto)throw new Error('No te alcanza: tienes '+pesos(cu.saldo));
            ap[col]={cuenta:cu.id,mov:opBanco(tx,F,db,cu,-x.apuesta.monto,'ajedrez-apuesta',`Ajedrez: apuesta en la sala ${codigo} (retenida)`,codigo)};
          }else{
            await sacarGatitoTx(tx,F,db,pago.gatito,codigo);
            ap[col]={gatito:pago.gatito};
          }
          upd.apuesta=ap;
        }
        tx.update(ref,upd);
      });
    }catch(e){await avisar('No se pudo entrar a la sala',esc(e.message||e),'err');return menu();}
  }
  escuchar(codigo);
}
async function escuchar(codigo){
  salirDeSala();
  const {db,F}=await DF.listo();
  PEDIDO++;PENSANDO=false;PISTA=null;
  MODO='linea';FIN=null;VISTA=null;SEL=-1;E=A.nuevo();RELOJ=null;reiniciarExtras();
  salaRef=F.doc(db,COLECCION,codigo);
  history.replaceState(null,'','#sala='+codigo);
  let primera=true;
  salaUnsub=F.onSnapshot(salaRef,snap=>{
    if(!snap.exists()){salirDeSala();avisar('La sala ya no existe','Quien la creó la cerró.').then(menu);return;}
    const d=snap.data({serverTimestamps:'estimate'});
    alCambiarSala(d,primera);primera=false;
  },e=>{avisar('Se perdió la conexión con la sala',esc(e.message||e),'err');});
}
function alCambiarSala(d,primera){
  const antes=SALA,colorAntes=MI_COLOR;SALA=d;
  MI_COLOR=d.blancas&&d.blancas.uid===USR.uid?'w':d.negras&&d.negras.uid===USR.uid?'b':'';
  // el tablero se gira hacia tu color apenas tienes asiento (la primera lectura puede venir de la caché)
  if(primera||(!colorAntes&&MI_COLOR))ORIENT=MI_COLOR||'w';
  // sincronizar la posición con la lista de jugadas de la sala
  const mias=E.historial.map(h=>h.uci), suyas=d.jugadas||[];
  const enviandoMia=ENVIANDO&&mias.length===suyas.length+1&&mias.slice(0,suyas.length).join()===suyas.join();
  if(mias.join()!==suyas.join()&&!enviandoMia){
    const extiende=suyas.length===mias.length+1&&suyas.slice(0,mias.length).join()===mias.join();
    try{
      if(extiende){const ant=E;E=A.jugarUci(E,suyas[suyas.length-1]);const h=E.historial[E.historial.length-1];if(VISTA==null)animar(h);sonarJugada(h);SEL=-1;if(!primera)comentarJugada(ant,E);}
      else{E=A.partida(suyas);SEL=-1;}
    }catch(e){console.warn('Jugadas no válidas en la sala',e);INVALIDA=d.codigo;}
  }
  if(d.estado==='fin'&&d.resultado){
    FIN={fin:true,...d.resultado};
    if(FIN_MOSTRADO!==d.codigo){FIN_MOSTRADO=d.codigo;if(!primera&&!CERRANDO)terminarLinea();}
  }else FIN=null;
  if(antes&&antes.estado==='espera'&&d.estado==='jugando'){SND.jaque();decir(Agustin.frase('inicio'));}
  pintarTodo();
  procesarSala();
}

// Envía la jugada con una transacción: la sala solo acepta la jugada si nadie más escribió antes.
async function enviarJugada(h,antes){
  const {db,F}=await DF.listo();
  const res=A.resultado(E), yo=antes.turno;
  ENVIANDO=true;pintarEstado();
  let margen=0,ok=false,ultimoError=null;
  for(let intento=0;intento<3&&!ok;intento++){
    const t0=Date.now();
    try{
      await F.runTransaction(db,async tx=>{
        const s=await tx.get(salaRef);const d=s.data();
        if(d.estado!=='jugando'||d.turno!==yo||(d.jugadas||[]).length!==antes.historial.length)throw new Error('La partida cambió mientras jugabas.');
        const upd={jugadas:[...d.jugadas,h.uci],fen:A.fen(E),turno:A.otro(yo),turnoDesde:F.serverTimestamp(),seq:d.seq+1,tablas:'',actualizado:F.serverTimestamp()};
        if(d.tiempo.base>0&&d.jugadas.length>0){
          const usado=srvAhora()-d.turnoDesde.toMillis();
          upd.reloj={...d.reloj,[yo]:Math.max(0,Math.round(d.reloj[yo]-usado+d.tiempo.inc-margen))};
        }
        if(res.fin){upd.estado='fin';upd.resultado={ganador:res.ganador,motivo:res.motivo};upd.finEn=F.serverTimestamp();}
        tx.update(salaRef,upd);
      });
      ok=true;
      // afinar la diferencia de relojes con la hora que puso el servidor
      const t1=Date.now();
      F.getDoc(salaRef).then(s=>{const x=s.data();if(x&&x.turnoDesde&&x.seq&&t1-t0<4000){const muestra=x.turnoDesde.toMillis()-(t0+t1)/2;DESF=DESF*.3+muestra*.7;}}).catch(()=>{});
    }catch(e){ultimoError=e;margen+=1500;if(/cambió/.test(e.message))break;}
  }
  ENVIANDO=false;
  if(!ok){
    SND.error();
    // volver a la posición de la sala
    try{E=A.partida(SALA.jugadas||[]);}catch(e){}
    pintarTodo();
    avisar('No se pudo enviar la jugada',esc(ultimoError&&ultimoError.message||'Error desconocido')+'<br><small>Revisa tu conexión. Si se te acabó el tiempo, la partida termina.</small>','err');
    return;
  }
  if(res.fin&&FIN_MOSTRADO!==SALA.codigo){FIN_MOSTRADO=SALA.codigo;FIN=res;terminarLinea();}
  pintarTodo();
}
async function accionSala(tipo){
  const {db,F}=await DF.listo();
  try{
    await F.runTransaction(db,async tx=>{
      const d=(await tx.get(salaRef)).data();
      if(d.estado!=='jugando')throw new Error('La partida ya terminó.');
      const yo=MI_COLOR,el=A.otro(yo),upd={seq:d.seq+1,actualizado:F.serverTimestamp()};
      if(tipo==='ofrecer')upd.tablas=yo;
      else if(tipo==='rechazar')upd.tablas='';
      else if(tipo==='aceptar'){if(d.tablas!==el)throw new Error('Ya no hay oferta de tablas.');upd.estado='fin';upd.resultado={ganador:'',motivo:'acuerdo'};}
      else if(tipo==='abandono'){upd.estado='fin';upd.resultado={ganador:el,motivo:'abandono'};}
      else if(tipo==='anulada'){upd.estado='fin';upd.resultado={ganador:'',motivo:'anulada'};}
      if(upd.estado==='fin')upd.finEn=F.serverTimestamp();
      tx.update(salaRef,upd);
    });
    if(tipo==='ofrecer')SND.mover();
  }catch(e){avisar('No se pudo',esc(e.message||e),'err');}
}
async function reclamarTiempo(){

}

// Envía un trabajo a la máquina (Web Worker); si el navegador no lo permite, lo hace en esta misma página.
function trabajoIA(msg,alProgreso){
  return new Promise(ok=>{
    let listo=false;const fin=r=>{if(!listo){listo=true;ok(r);}};
    const plan=()=>iaEnVentana().then(IA=>setTimeout(()=>{
      if(msg.tipo==='analisis')return fin({analisis:IA.analizar(msg.jugadas,Math.min(msg.ms||300,150),alProgreso)});
      const m=IA.elegir(A.partida(msg.jugadas),msg.nivel);fin({uci:m?A.uci(m):null});},30)).catch(()=>fin({}));
    if(WORKER===false)return plan();
    try{
      if(!WORKER)WORKER=new Worker('ia.js');
      const w=WORKER,id=++IDIA,espera=msg.tipo==='analisis'?240000:15000;
      const f=ev=>{const d=ev.data||{};if(d.id!==id)return;
        if(d.progreso!=null&&d.analisis==null){if(alProgreso)alProgreso(d.progreso);clearTimeout(t);t=setTimeout(err,espera);return;}
        limpiar();fin(d);};
      const err=()=>{limpiar();WORKER=false;plan();};
      let t=setTimeout(err,espera);
      const limpiar=()=>{clearTimeout(t);w.removeEventListener('message',f);w.removeEventListener('error',err);};
      w.addEventListener('message',f);w.addEventListener('error',err);
      w.postMessage({...msg,id});
    }catch(e){WORKER=false;plan();}
  });
}
function pedirIA(jugadas,nivel){return trabajoIA({tipo:'jugada',jugadas,nivel}).then(r=>r.uci||null);}
async function turnoMaquina(){

function opBanco(tx,F,db,cu,monto,tipo,motivo,cod){

/* ═════════════ resultado firme, cobros y ranking ═════════════ */
function firme(d){
  if(!d||d.estado!=='fin'||d.disputa||!d.resultado)return false;
  if(['abandono','tiempo','acuerdo','anulada','cancelada','profe'].includes(d.resultado.motivo))return true;
  if(d.confirmado)return true;
  return !!d.finEn&&srvAhora()>ms(d.finEn)+30*60000+3000;
}
function cobroDe(d,c){
  if(!d.apuesta||!d.resultado||!c)return '';
  if(d.resultado.ganador===c)return 'premio';
  return d.resultado.ganador===''&&d.apuesta[c]?'devuelto':'';
}
function pendienteCobro(d){
  if(!USR)return false;
  const c=d.blancas&&d.blancas.uid===USR.uid?'w':d.negras&&d.negras.uid===USR.uid?'b':'';
  return !!(c&&d.estado==='fin'&&d.pagos&&!d.pagos[c]&&cobroDe(d,c));
}
function revisarJugadas(j){
  let e=A.nuevo();
  for(let i=0;i<j.length;i++){
    if(!A.buscarUci(e,j[i]))return {ok:false,i,uci:j[i],color:e.turno};
    e=A.jugarUci(e,j[i]);
  }
  return {ok:true,res:A.resultado(e)};
}
async function procesarSala(){
  if(PROCESANDO||MODO!=='linea'||!SALA||!MI_COLOR||!salaRef)return;
  PROCESANDO=true;let otra=false;
  try{
    const d=SALA,c=MI_COLOR,{db,F}=await DF.listo();
    // una jugada no válida durante la partida: se detiene y la revisa el profe
    if(d.estado==='jugando'&&INVALIDA===d.codigo){
      await F.runTransaction(db,async tx=>{const x=(await tx.get(salaRef)).data();if(x.estado!=='jugando')return;
        tx.update(salaRef,{estado:'fin',resultado:{ganador:'',motivo:'disputa'},disputa:true,finEn:F.serverTimestamp(),seq:x.seq+1,actualizado:F.serverTimestamp()});});
      return;
    }
    if(d.estado!=='fin'||!d.resultado||!d.pagos)return;
    // final en el tablero: quien recibió la última jugada lo revisa con el motor y confirma (o reclama)
    if(MOTIVOS_TABLERO.includes(d.resultado.motivo)&&!d.confirmado&&!d.disputa&&d.turno===c&&d.finEn&&srvAhora()<ms(d.finEn)+29*60000){
      const rev=revisarJugadas(d.jugadas||[]);
      const bien=rev.ok&&rev.res.fin&&rev.res.motivo===d.resultado.motivo&&rev.res.ganador===d.resultado.ganador;
      await F.runTransaction(db,async tx=>{const x=(await tx.get(salaRef)).data();if(x.confirmado||x.disputa)return;
        tx.update(salaRef,bien?{confirmado:true,seq:x.seq+1,actualizado:F.serverTimestamp()}:{disputa:true,seq:x.seq+1,actualizado:F.serverTimestamp()});});
      otra=true;return;
    }
    if(!firme(d)){
      if(!d.disputa&&d.finEn&&(cobroDe(d,c)||d.resultado.ganador===c)){
        clearTimeout(REINTENTO);REINTENTO=setTimeout(procesarSala,Math.max(5000,ms(d.finEn)+30*60000+5000-srvAhora()));
      }
      return;
    }
    if(cobroDe(d,c)&&!d.pagos[c]){await cobrar(c);otra=true;return;}
    if(d.resultado.ganador===c&&d.contado&&!d.contado[c]&&(d.jugadas||[]).length>=20){await sumarVictoria(c);otra=true;}
  }catch(e){console.warn('procesarSala',e);AVISO_COBRO='⚠️ No se pudo completar: '+(e.message||e);pintarAvisos();}
  finally{PROCESANDO=false;if(otra)setTimeout(procesarSala,600);}
}
// Cobra lo que le toca a «c» en la sala actual (premio o devolución). También sirve al cerrar una sala en espera.
async function cobrar(c,cancelar){
  const {db,F}=await DF.listo();
  let texto='';
  await F.runTransaction(db,async tx=>{
    const d=(await tx.get(salaRef)).data();
    const upd={seq:d.seq+1,actualizado:F.serverTimestamp()};
    let fin=d;
    if(cancelar){
      if(d.estado!=='espera')throw new Error('Tu rival ya entró a la sala.');
      Object.assign(upd,{estado:'fin',resultado:{ganador:'',motivo:'cancelada'},finEn:F.serverTimestamp()});
      fin={...d,...upd};
    }
    const que=cobroDe(fin,c);
    if(!d.apuesta||!que||d.pagos[c])return;
    upd.pagos={...d.pagos,[c]:que};
    if(d.apuesta.tipo==='hipopesos'){
      const cu=await leerCuentaTx(tx), monto=que==='premio'?d.apuesta.monto*2:d.apuesta.monto;
      opBanco(tx,F,db,cu,monto,que==='premio'?'ajedrez-premio':'ajedrez-devolucion',
        que==='premio'?`Ajedrez: ganaste la apuesta de la sala ${d.codigo}`:`Ajedrez: vuelve tu apuesta de la sala ${d.codigo}`,d.codigo);
      texto=que==='premio'?`💰 ¡Cobraste ${pesos(monto)}!`:`💰 Te devolvieron ${pesos(monto)}.`;
    }else{
      const ref=F.doc(db,'gatitos',USR.uid),g=await tx.get(ref),ids=g.exists()?(g.data().ids||[]):[];
      const nuevos=que==='premio'?[d.apuesta.w.gatito,d.apuesta.b.gatito]:[d.apuesta[c].gatito];
      const todos=[...new Set([...ids,...nuevos])];
      const fav=g.exists()&&todos.includes(g.data().favorito)?g.data().favorito:todos[0];
      if(g.exists())tx.update(ref,{ids:todos,favorito:fav,ajedrezCobro:d.codigo,actualizado:F.serverTimestamp()});
      else throw new Error('No se encontró tu colección de gatitos.');
      texto=que==='premio'?`🐱 ¡Te llevas a ${nuevos.map(x=>gatitoInfo(x).nombre).join(' y ')}!`:`🐱 ${gatitoInfo(nuevos[0]).nombre} volvió a tu colección.`;
    }
    tx.update(salaRef,upd);
  });
  if(texto){AVISO_COBRO=texto;SND.fin();pintarAvisos();}
}
async function sumarVictoria(c){

}
async function cerrarSala(){
  const d=SALA;if(!d)return;
  if(!await confirmar('¿Cerrar la sala?',d.apuesta?'Nadie más podrá entrar y te vuelve lo que apostaste.':'Nadie más podrá entrar con este código.'))return;

// Explica si la partida suma (o no) al ranking de victorias.
function notaRanking(r){
  const n=E.historial.length;
  if(MODO==='maquina')return '<p class="notas" style="text-align:center">🏆 Práctica: las partidas contra la máquina no suman al ranking.</p>';
  if(MODO==='local')return '<p class="notas" style="text-align:center">🏆 Para sumar al ranking, juega en línea contra otra persona.</p>';

function textoApuestaFin(r){
  const d=SALA,c=MI_COLOR;
  if(!d||!d.apuesta||!c)return '';
  if(r.motivo==='disputa')return '<p class="notas" style="text-align:center">Lo apostado queda retenido hasta que el profe resuelva.</p>';

  if(r.ganador===c)t=ap.tipo==='hipopesos'?`Ganas <b>${pesos(ap.monto*2)}</b>.`:`Te llevas a <b>${esc(gatitoInfo(ap.w.gatito).nombre)}</b> y <b>${esc(gatitoInfo(ap.b.gatito).nombre)}</b>.`;
  else if(r.ganador==='')t='Te vuelve lo que apostaste.';
  else t=ap.tipo==='hipopesos'?`Pierdes tus ${pesos(ap.monto)}.`:`Tu gatito pasa a tu rival.`;
  const espera=!firme(d)&&MOTIVOS_TABLERO.includes(r.motivo)?'<br><small>Se entrega cuando el equipo de tu rival confirme el resultado (o en 30 minutos).</small>':'';
  return `<p style="text-align:center">💰 ${t}${espera}</p>`;
}
function avisoEspera(){
  const d=SALA,c=MI_COLOR;
  if(MODO!=='linea'||!d||!c||d.estado!=='fin'||!d.resultado)return '';
  if(d.disputa)return '<div class="aviso err">⚖️ Partida en revisión: un equipo detectó una jugada no válida. El profe la resolverá y después se podrá cobrar.</div>';
  const quiere=cobroDe(d,c)&&d.pagos&&!d.pagos[c]||d.resultado.ganador===c&&d.contado&&!d.contado[c]&&(d.jugadas||[]).length>=20;
  if(quiere&&!firme(d)&&d.finEn){
    const h=new Date(ms(d.finEn)+30*60000-DESF).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
    return `<div class="aviso">⏳ Esperando que el equipo de tu rival confirme el resultado. Si no responde, se cobra solo a las ${h} (deja esta página abierta o vuelve desde «Mis partidas»).</div>`;
  }
  return '';
}

/* ═════════════ revisión del profe (reclamos) ═════════════ */
function htmlProfe(d){
  if(!USR||!window.DF||!DF.esProfe(USR)||d.estado!=='fin'||!(d.disputa||MOTIVOS_TABLERO.includes((d.resultado||{}).motivo)&&!d.confirmado))return '';
  const rev=revisarJugadas(d.jugadas||[]);
  const txt=rev.ok?`Todas las jugadas son legales. El tablero dice: <b>${esc(textoResultado(rev.res.fin?rev.res:{ganador:'',motivo:'sin terminar'}))}</b>.`
    :`Jugada ${rev.i+1} (<b>${esc(rev.uci)}</b>) de las ${NOMBRE_COLOR[rev.color].toLowerCase()} <b>no es válida</b>.`;
  return `<div class="aviso err"><b>Revisión del profe</b><br>${txt}<div class="acciones">
    <button class="btn chico" data-profe="w">Ganan blancas</button><button class="btn chico" data-profe="b">Ganan negras</button><button class="btn sec chico" data-profe="">Tablas</button></div></div>`;
}
async function resolverProfe(g){
  if(!await confirmar('¿Resolver la partida?',g?`Ganan las ${NOMBRE_COLOR[g].toLowerCase()} y se llevan lo apostado.`:'Tablas: a cada uno le vuelve lo suyo.'))return;
  const {db,F}=await DF.listo();
  try{
    await F.runTransaction(db,async tx=>{const x=(await tx.get(salaRef)).data();
      tx.update(salaRef,{estado:'fin',resultado:{ganador:g,motivo:'profe'},disputa:false,confirmado:true,seq:x.seq+1,actualizado:F.serverTimestamp()});});
  }catch(e){avisar('No se pudo',esc(e.message||e),'err');}
}

/* ═════════════ San Agustín comenta ═════════════ */
function reiniciarExtras(){COMENTARIO=null;AVISO_TIEMPO={};ANALISIS=null;ANALIZANDO=false;}
function decir(f){if(!f)return;COMENTARIO={...f,nuevo:true};pintarAgustin();}
function comentarJugada(antes,despues){
  if(!COMENTARIOS)return;
  const yo=MODO==='maquina'&&MAQ?MAQ.color:MODO==='linea'?MI_COLOR:'';
  try{decir(Agustin.comentar(antes,despues,{modo:MODO,yo}));}catch(e){console.warn(e);}
}
function pintarAgustin(){
  const el=$('agustin');
  if(!COMENTARIOS||!COMENTARIO){el.innerHTML='';return;}
  const c=COMENTARIO;
  el.className='agustin'+(c.nuevo?' nuevo':'');c.nuevo=false;
  el.innerHTML=`<img src="sprites/agustin.webp" alt="San Agustín" onerror="this.onerror=null;this.src=Pixel.urlPieza('K',44)"><div class="globo"><b>San Agustín de Hipona</b>${esc(c.texto)}${c.cita?`<small>«${esc(c.cita[0])}» — ${esc(c.cita[1])}</small>`:''}</div>`;
}

/* ═════════════ análisis de la partida (para aprender) ═════════════ */
function analisisActual(){
  if(!ANALISIS)return null;
  const j=E.historial.map(h=>h.uci).join(' ');
  return ANALISIS.clave===j?ANALISIS.items:null;
}
async function analizarPartida(){
  if(ANALIZANDO)return;
  const jugadas=E.historial.map(h=>h.uci);
  if(jugadas.length<2)return;
  if(analisisActual()){VISTA=null;pintarTodo();$('analisis').scrollIntoView({behavior:'smooth',block:'start'});return;}
  ANALIZANDO=true;const clave=jugadas.join(' ');
  const caja=$('analisis');caja.hidden=false;
  const f=Agustin.frase('analisis');decir(f);
  caja.innerHTML=`<h2>📖 Análisis de la partida</h2><p style="font-size:.95rem">San Agustín está revisando ${jugadas.length} jugadas…</p><div class="barra-prog"><i id="an-prog"></i></div>`;
  pintarAcciones();
  caja.scrollIntoView({behavior:'smooth',block:'start'});
  const r=await trabajoIA({tipo:'analisis',jugadas,ms:300},p=>{const b=$('an-prog');if(b)b.style.width=Math.round(p*100)+'%';});
  ANALIZANDO=false;
  if(!r||!r.analisis){caja.innerHTML='<h2>📖 Análisis</h2><div class="aviso err">No se pudo analizar la partida en este navegador.</div>';pintarAcciones();return;}
  ANALISIS={clave,items:r.analisis};
  VISTA=1;
  // empieza en el primer error importante, si hay
  const yo=MODO==='maquina'&&MAQ?MAQ.color:MODO==='linea'?MI_COLOR:'';
  const primero=r.analisis.find(it=>['error','grave'].includes(it.categoria)&&(!yo||it.color===yo));
  if(primero)VISTA=primero.n+1;
  if(VISTA>=E.historial.length)VISTA=null;
  const tot=r.analisis.filter(it=>!yo||it.color===yo);
  decir(Agustin.resumen(Agustin.precision(tot),contar(tot)));
  pintarTodo();
}
function contar(items){const c={mejor:0,excelente:0,buena:0,imprecision:0,error:0,grave:0};items.forEach(it=>c[it.categoria]++);return c;}
function pintarAnalisis(){
  const caja=$('analisis'),an=analisisActual();
  if(ANALIZANDO)return;
  if(!an){caja.hidden=true;caja.innerHTML='';return;}
  caja.hidden=false;
  const lado=c=>{const it=an.filter(x=>x.color===c),k=contar(it);
    return `<div>${NOMBRE_COLOR[c]}<b>${Agustin.precision(it)}%</b><span class="cuentas-an">${k.grave?`<span class="cat-grave">${k.grave} ??</span> `:''}${k.error?`<span class="cat-error">${k.error} ?</span> `:''}${k.imprecision?`<span class="cat-imprecision">${k.imprecision} ?!</span> `:''}${k.mejor?`<span class="cat-mejor">${k.mejor} ★</span>`:''}</span></div>`;};
  const idx=(VISTA==null?E.historial.length:VISTA)-1, it=an[idx];
  let lista='';
  an.forEach((x,i)=>{
    if(x.color==='w'||i===0){lista+=`<li class="n">${x.num}.</li>`;if(x.color==='b')lista+='<li></li>';}
    lista+=`<li><button data-an="${i}" class="cat-${x.categoria}${i===idx?' ver':''}">${esc(x.san)} ${Agustin.SIMBOLO[x.categoria]}</button></li>`;
  });
  let detalle='';
  if(it){
    detalle=`<div class="an-detalle"><div class="tit"><span class="cat-${it.categoria}">${it.num}${it.color==='w'?'.':'…'} ${esc(it.san)} ${Agustin.SIMBOLO[it.categoria]} · ${Agustin.NOMBRE_CAT[it.categoria]}</span></div>
      ${esc(Agustin.explicar(it))}${it.mejor?`<br><small style="color:#7fe08a">En el tablero, el marco verde muestra ${esc(it.mejor.san)}.</small>`:''}</div>`;
  }
  caja.innerHTML=`<h2>📖 Análisis de la partida</h2>
    <div class="precision">${lado('w')}${lado('b')}</div>
    <canvas id="grafico" width="200" height="48" title="Ventaja durante la partida (arriba: blancas)"></canvas>
    <ol class="an-lista">${lista}</ol>${detalle}
    <p class="notas">★ mejor jugada · ! excelente · ✓ buena · ?! imprecisión · ? error · ?? error grave. Toca una jugada para verla en el tablero.</p>`;
  dibujarGrafico(an,idx);
  const sel=caja.querySelector('.an-lista .ver');if(sel)sel.scrollIntoView({block:'nearest'});
}
$('analisis').addEventListener('click',ev=>{
  const b=ev.target.closest('[data-an]');
  if(b){const i=+b.dataset.an+1;VISTA=i>=E.historial.length?null:i;SEL=-1;pintarTodo();return;}
  if(ev.target.id==='grafico'){const an=analisisActual();if(!an)return;const r=ev.target.getBoundingClientRect();
    const i=Math.min(an.length-1,Math.max(0,Math.floor((ev.clientX-r.left)/r.width*an.length)))+1;VISTA=i>=E.historial.length?null:i;pintarTodo();}
});
function dibujarGrafico(an,sel){
  const c=$('grafico');if(!c)return;const g=c.getContext('2d'),W=c.width,H=c.height,mid=H/2;
  g.fillStyle='#24386c';g.fillRect(0,0,W,H);g.fillStyle='#efe3c4';
  const n=an.length,ancho=W/n;
  an.forEach((it,i)=>{const v=Math.max(-800,Math.min(800,it.eval)),y=Math.round(mid-v/800*(mid-2));
    g.fillStyle='#efe3c4';g.fillRect(Math.floor(i*ancho),y,Math.ceil(ancho),H-y);});
  g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,mid,W,1);
  an.forEach((it,i)=>{if(['error','grave'].includes(it.categoria)){g.fillStyle=it.categoria==='grave'?'#ff5a5a':'#ff9a4d';g.fillRect(Math.floor(i*ancho),0,Math.max(1,Math.ceil(ancho)),3);}});
  if(sel>=0){g.fillStyle='#ffd66b';g.fillRect(Math.floor(sel*ancho),0,Math.max(2,Math.ceil(ancho)),H);}
}
